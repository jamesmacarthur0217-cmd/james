<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordings</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/session.js"></script>
<style>
  /* Day bar colors: categorical slots 1 (recorded) and 2 (a person appeared), each mode its own steps. */
  main { --rec: #2a78d6; --person: #eb6834; --grid: #e6e6e3; }
  @media (prefers-color-scheme: dark) { main { --rec: #3987e5; --person: #d95926; --grid: #2e3440; } }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls input[type=date] { font: inherit; }
  .daybar { position: relative; margin-top: 14px; user-select: none; }
  .daybar svg { display: block; width: 100%; height: 64px; cursor: pointer; }
  .daybar .grid line { stroke: var(--grid); }
  .daybar .axis text { fill: var(--muted); font-size: 11px; }
  .daybar .hair { stroke: var(--text); stroke-width: 1; }
  .daybar .tip { position: absolute; top: -6px; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 12px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    background: var(--dot); margin-right: 5px; vertical-align: -1px; }
  .rec-player { margin-top: 14px; }
  .rec-player video, .rec-player img { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; display: block; }
  .rec-player [hidden], .rec-player[hidden] { display: none; }
  .now { font-variant-numeric: tabular-nums; margin: 8px 0 0; }
  table.recs { border-collapse: collapse; font-size: 13px; width: 100%; margin-top: 8px; }
  table.recs td, table.recs th { border-bottom: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  table.recs td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.recs tr.playing td { background: var(--chip); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  /* Search by words (Phase 16): one row per moment. */
  .find { display: flex; gap: 8px; flex-wrap: wrap; }
  .find input { flex: 1; min-width: 200px; font: inherit; }
  .moments { margin-top: 10px; }
  .moment { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .moment.playing { background: var(--chip); }
  .moment img, .moment .pic-none { width: 48px; height: 64px; object-fit: cover; border-radius: 6px; flex: none;
    background: var(--chip); }
  .moment .what { flex: 1; min-width: 0; }
  .moment .what small { color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
  .moment .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .moment .chip.differs { outline: 1px dashed var(--warn); }
  @media (max-width: 560px) { .moment { flex-wrap: wrap; } .moment .actions { flex-basis: 100%; padding-left: 58px; } }
</style>
</head>
<body>
<header>
  <h1>VisionLabeler</h1>
  <nav><a href="/">Live</a><a href="/recordings" class="active">Recordings</a><a href="/summary">Summary</a><a href="/review" class="admin-only">Review queue</a><a href="/reports" class="admin-only">Reports</a><a href="/alerts" class="admin-only">Alerts</a><a href="/answer-key" class="admin-only">Answer key</a><a href="/check" class="admin-only">Check</a><a href="/audit" class="admin-only">Audit log</a><a href="/import" class="admin-only">Import</a><a href="/settings" class="admin-only">Settings</a><a href="/health">Health</a></nav>
</header>
<main>
  <section class="panel">
    <h2>Find in recordings</h2>
    <form class="find" id="find">
      <input id="question" maxlength="300" aria-label="What to find"
        placeholder="e.g. woman in a red top this morning, man with a backpack yesterday evening, white car">
      <button class="primary" type="submit">Search</button>
      <button type="button" id="photo-btn" title="Find a person by a picture of them (JPEG or PNG; it is not stored)">or with a photo</button>
      <input type="file" id="photo-file" accept="image/jpeg,image/png" hidden>
      <button type="button" id="play-all" hidden>▶ Play all</button>
    </form>
    <p class="hint" id="found-note" style="margin:8px 0 0"></p>
    <div class="moments" id="moments"></div>
  </section>
  <section class="panel">
    <div class="controls">
      <label for="camera">Camera</label> <select id="camera"></select>
      <button id="prev" title="The day before">◀</button>
      <input type="date" id="day">
      <button id="next" title="The day after">▶</button>
      <span class="muted" id="summary"></span>
      <button id="lapse" title="About a minute of video of this camera's whole day" hidden>▶ Time-lapse</button>
      <span class="muted" id="lapse-note"></span>
      <button id="lapse-again" class="link" title="Make it again with what was recorded since" hidden>Make again</button>
    </div>
    <div class="daybar" id="daybar"></div>
    <div class="legend"><span style="--dot: var(--rec)">recorded</span><span style="--dot: var(--person)">a person appeared</span></div>
    <p class="hint" id="hint"></p>
    <div class="rec-player" id="player" hidden>
      <video id="video" controls playsinline muted hidden></video>
      <img id="stream" alt="Recording" hidden>
      <p class="now"><b id="now"></b> <span class="muted" id="now-note"></span>
        <button id="stop" hidden>Stop</button>
        <button id="lapse-open" title="Open the real recording at this point of the time-lapse" hidden>Open this moment</button></p>
    </div>
  </section>
  <section class="panel">
    <h2>Recordings this day</h2>
    <div id="list"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let data = null, playing = null;   // playing: {rec, startMs}
let found = null, queue = null, stopTimer = null;   // the last search; Play all: the moments still to play

function pad(n) { return String(n).padStart(2, "0"); }
function localDay(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function clock(ms) { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function length(s) { s = Math.round(s); return s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min`
  : s >= 60 ? `${Math.floor(s / 60)} min ${s % 60} s` : `${s} s`; }
function ms(iso) { return new Date(iso).getTime(); }   // the server sends local times without a zone

async function load(day, camera) {
  const q = new URLSearchParams({ day });
  if (camera) q.set("camera", camera);
  const r = await fetch("/api/recordings?" + q);
  if (!r.ok) { $("list").innerHTML = '<div class="empty">Could not load the recordings.</div>'; return; }
  data = await r.json();
  $("camera").replaceChildren(...data.cameras.map(c => Object.assign(document.createElement("option"),
    { value: c, textContent: c, selected: c === data.camera })));
  $("day").value = data.day;
  const total = data.recordings.reduce((s, x) => s + ((x.end ? ms(x.end) : Date.now()) - ms(x.start)) / 1000, 0);
  $("summary").textContent = data.recordings.length
    ? `${data.recordings.length} recording${data.recordings.length === 1 ? "" : "s"}, ${length(total)}`
      + (data.admin ? `, ${data.recordings.reduce((s, x) => s + (x.size_mb || 0), 0).toFixed(0)} MB` : "")
    : "";
  $("hint").textContent = !data.enabled ? "Recording is turned off (Settings, or recording.enabled in config.yaml)."
    : `Recorded while people are in view; kept ${data.keep_days} days. Click the bar to play from that moment.`;
  drawBar();
  drawList();
  checkLapse();
}

// --- The day's time-lapse (labeler/timelapse.py): about a minute of the camera's day; viewers get it blurred ---
let lapse = null;   // the time-lapse playing: {camera, day, frames: [[recording, second, time]], fps}
async function lapseStatus() {
  const q = new URLSearchParams({ camera: data.camera, day: data.day });
  const r = await fetch("/api/recordings/timelapse?" + q);
  return r.ok ? r.json() : { state: "none", recorded: false };
}
function lapseNote(d) {
  $("lapse-note").textContent = d.state !== "done" ? ""
    : `${Math.round(d.seconds)} s` + (d.older && d.made_at ? `, made at ${clock(ms(d.made_at))}` : "");
  $("lapse-again").hidden = !(d.state === "done" && d.older);
}
async function checkLapse() {
  const d = await lapseStatus();
  $("lapse").hidden = !(d.recorded || d.state !== "none");
  lapseNote(d);
  if (d.state === "making") pollLapse();
}
$("lapse").onclick = () => makeLapse(false);
$("lapse-again").onclick = () => makeLapse(true);
async function makeLapse(again) {
  $("lapse-again").hidden = true;
  const r = await fetch("/api/recordings/timelapse", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ camera: data.camera, day: data.day, again }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("lapse-note").textContent = d.detail || "The time-lapse could not be made."; return; }
  if (d.state === "done") playLapse(await lapseStatus()); else pollLapse();
}
async function pollLapse() {
  const d = await lapseStatus();
  if (d.state === "making") {
    $("lapse-note").textContent = `Making the time-lapse… ${Math.min(99, Math.round(100 * d.done_frames / Math.max(1, d.total)))}%`;
    setTimeout(pollLapse, 1000);
  } else if (d.state === "failed") {
    $("lapse-note").textContent = `The time-lapse could not be made: ${d.error}`;
  } else if (d.state === "done") {
    lapseNote(d);
    playLapse(d);
  } else {
    $("lapse-note").textContent = "The time-lapse could not be made; try again.";
  }
}
function playLapse(d) {
  lapse = d; playing = null; queue = null;
  clearTimeout(stopTimer); stopStream();
  const v = $("video");
  $("player").hidden = false; $("stream").hidden = true; $("stop").hidden = true; v.hidden = false;
  $("lapse-open").hidden = false;
  v.src = `/recordings/timelapse/${encodeURIComponent(d.camera)}/${d.day}.mp4?v=${d.version}`;
  v.onloadedmetadata = () => v.play().catch(() => {});
  const show = () => {
    const f = d.frames[Math.min(d.frames.length - 1, Math.floor(v.currentTime * d.fps))];
    $("now").textContent = `${d.camera} · time-lapse of ${d.day} · ${f ? clock(ms(f[2])) : ""}`;
    $("now-note").textContent = data.admin ? "" : "(faces blurred)";
  };
  v.ontimeupdate = show;
  show();
  drawList();
  $("player").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
$("lapse-open").onclick = () => {
  const v = $("video"), f = lapse && lapse.frames[Math.min(lapse.frames.length - 1, Math.floor(v.currentTime * lapse.fps))];
  if (!f) return;
  v.pause();
  playAt(ms(f[2]));   // the real recording at that moment (labeler/recordings_web.py find)
};

// The day bar: one axis (hours), recorded stretches as bars, people as ticks; a crosshair shows the time.
function drawBar() {
  const box = $("daybar"), W = Math.max(300, box.clientWidth), H = 64, L = 4, R = 4, T = 6, B = 18;
  const day0 = ms(data.day + "T00:00:00"), span = 86400000;
  const x = (t) => L + (W - L - R) * Math.min(1, Math.max(0, (t - day0) / span));
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Recorded times on ${data.day}"><g class="grid">`;
  for (let h = 0; h <= 24; h += 3) svg += `<line x1="${x(day0 + h * 3600000)}" x2="${x(day0 + h * 3600000)}" y1="${T}" y2="${H - B}"/>`;
  svg += '</g><g class="axis">';
  for (let h = 0; h < 24; h += 3) svg += `<text x="${x(day0 + h * 3600000) + 2}" y="${H - 4}">${pad(h)}:00</text>`;
  svg += "</g>";
  for (const r of data.recordings) {
    const a = x(ms(r.start)), b = Math.max(a + 2, x(r.end ? ms(r.end) : Date.now()));
    svg += `<rect x="${a}" y="${T + 8}" width="${b - a}" height="${H - B - T - 8}" rx="2" style="fill:var(--rec)"/>`;
  }
  for (const p of data.people) {
    const px = x(ms(p.at));
    svg += `<line x1="${px}" x2="${px}" y1="${T}" y2="${T + 6}" style="stroke:var(--person)" stroke-width="2"/>`;
  }
  svg += `<line class="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/></svg>`;
  box.innerHTML = svg + '<div class="tip" hidden></div>';
  const el = box.querySelector("svg"), hair = box.querySelector(".hair"), tip = box.querySelector(".tip");
  const timeAt = (e) => { const b = el.getBoundingClientRect(); const px = (e.clientX - b.left) * W / b.width;
    return day0 + span * Math.min(1, Math.max(0, (px - L) / (W - L - R))); };
  el.addEventListener("pointermove", (e) => {
    const t = timeAt(e), b = el.getBoundingClientRect();
    hair.setAttribute("x1", x(t)); hair.setAttribute("x2", x(t)); hair.setAttribute("visibility", "visible");
    const rec = data.recordings.find(r => ms(r.start) <= t && t <= (r.end ? ms(r.end) : Date.now()));
    tip.hidden = false;
    tip.style.left = (x(t) * b.width / W) + "px";
    tip.textContent = clock(t) + (rec ? " · recorded" : " · not recorded");
  });
  el.addEventListener("pointerleave", () => { tip.hidden = true; hair.setAttribute("visibility", "hidden"); });
  el.addEventListener("click", (e) => playAt(timeAt(e)));
}
new ResizeObserver(() => { if (data) drawBar(); }).observe($("daybar"));

function drawList() {
  if (!data.recordings.length) {
    $("list").innerHTML = '<div class="empty">Nothing was recorded this day.</div>';
    return;
  }
  const table = document.createElement("table");
  table.className = "recs";
  const head = table.insertRow();
  ["From", "To", "Length", ...(data.admin ? ["Size"] : []), ""].forEach(h => {
    const th = document.createElement("th"); th.textContent = h; head.append(th); });
  for (const r of data.recordings) {
    const tr = table.insertRow();
    tr.dataset.id = r.id;
    if (playing && playing.rec.id === r.id) tr.className = "playing";
    const end = r.end ? ms(r.end) : Date.now();
    tr.insertCell().textContent = clock(ms(r.start));
    tr.insertCell().textContent = r.open ? "recording now" : clock(end);
    Object.assign(tr.insertCell(), { className: "num", textContent: length((end - ms(r.start)) / 1000) });
    if (data.admin) Object.assign(tr.insertCell(), { className: "num", textContent: r.size_mb + " MB" });
    const cell = tr.insertCell(), actions = document.createElement("div");
    actions.className = "actions";
    const btn = (label, fn, cls) => { const b = document.createElement("button"); b.textContent = label;
      if (cls) b.className = cls; b.onclick = fn; actions.append(b); };
    btn("▶ Play", () => play(r, 0));
    if (data.admin && !r.open) {
      btn("Download", () => { location.href = `/api/recordings/${r.id}/download`; });
      btn("Delete", () => remove(r), "danger-quiet");
    }
    cell.append(actions);
  }
  $("list").replaceChildren(table);
}

async function playAt(t) {
  const r = await fetch(`/api/recordings/find?camera=${encodeURIComponent(data.camera)}&at=${encodeURIComponent(localIso(t))}`);
  if (!r.ok) { $("hint").textContent = `Nothing was recorded at ${clock(t)}.`; return; }
  const f = await r.json();
  const rec = data.recordings.find(x => x.id === f.id) || { id: f.id, start: f.start, open: false };
  play(rec, f.offset_s, f.video_s);
}
function localIso(t) { const d = new Date(t); return `${localDay(d)}T${clock(t)}`; }

// Admins play the file (seeking by the browser); viewers a stream made by the app with faces blurred.
// `until` (a search's moment): {videoEnd: seconds in the file, seconds: its length, onEnd} stops it at its end.
function play(rec, offsetS, videoS, until) {
  playing = { rec, startMs: ms(rec.start) };
  lapse = null; $("lapse-open").hidden = true;
  $("player").hidden = false;
  const v = $("video"), img = $("stream");
  stopStream();
  clearTimeout(stopTimer);
  if (data.admin && !rec.open) {
    img.hidden = true; v.hidden = false; $("stop").hidden = true;
    v.src = `/recordings/file/${rec.id}`;
    v.onloadedmetadata = () => { v.currentTime = videoS ?? offsetS * 1; v.play().catch(() => {}); };
    v.ontimeupdate = until ? () => {
      if (v.currentTime >= until.videoEnd) { v.ontimeupdate = null; v.pause(); until.onEnd && until.onEnd(); }
    } : null;
    showNow(playing.startMs + (offsetS || 0) * 1000, "(the exact time is on the picture)");
  } else {
    v.pause(); v.removeAttribute("src"); v.load(); v.hidden = true;
    img.hidden = false; $("stop").hidden = false;
    img.src = `/recordings/stream/${rec.id}?t=${offsetS || 0}` + (until ? `&d=${until.seconds}` : "");
    // The stream ends by itself after d seconds; the page waits as long (it plays in real time), then goes on.
    if (until && until.onEnd) stopTimer = setTimeout(until.onEnd, (until.seconds + 1.5) * 1000);
    showNow(playing.startMs + (offsetS || 0) * 1000, data.admin ? "(still being recorded; the exact time is on the picture)"
      : "(faces blurred; the exact time is on the picture)");
  }
  drawList();
  $("player").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function showNow(t, note) { $("now").textContent = `${data.camera} · from ${localDay(new Date(t))} ${clock(t)}`; $("now-note").textContent = note; }
function stopStream() { const img = $("stream"); if (img.src) { img.removeAttribute("src"); } }
$("stop").onclick = () => { stopStream(); clearTimeout(stopTimer); queue = null; $("stream").hidden = true; $("stop").hidden = true; };

async function remove(r) {
  if (!confirm(`Delete the recording from ${clock(ms(r.start))} to ${clock(ms(r.end))}? This cannot be undone.`)) return;
  const res = await fetch("/api/recordings/delete", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ids: [r.id] }) });
  if (!res.ok) { alert("Could not delete"); return; }
  if (playing && playing.rec.id === r.id) { $("player").hidden = true; stopStream(); $("video").removeAttribute("src"); }
  load(data.day, data.camera);
}

function shiftDay(n) { const d = new Date($("day").value + "T12:00:00"); d.setDate(d.getDate() + n); load(localDay(d), data.camera); }
$("prev").onclick = () => shiftDay(-1);
$("next").onclick = () => shiftDay(1);
$("day").onchange = () => load($("day").value, data && data.camera);
$("camera").onchange = () => load($("day").value, $("camera").value);

// --- Search by words (labeler/moments.py): moments to play, newest first ---
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
const WORD = { person: ["person", "people"], vehicle: ["vehicle", "vehicles"], animal: ["animal", "animals"] };
function count(items) {
  const n = {};
  items.forEach(i => { n[i.type] = (n[i.type] || 0) + 1; });
  return Object.entries(n).map(([k, c]) => `${c} ${WORD[k][c === 1 ? 0 : 1]}`).join(", ");
}

$("find").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;
  $("found-note").textContent = "Searching…";
  $("moments").innerHTML = "";
  $("play-all").hidden = true;
  const r = await fetch("/api/recordings/search", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { found = null; $("found-note").textContent = d.detail || "The search did not work."; return; }
  found = d;
  drawFound();
};

// Search by photo (Phase 33): the picture is sent as it is and not stored; the closest people come first.
$("photo-btn").addEventListener("click", () => $("photo-file").click());
$("photo-file").addEventListener("change", async () => {
  const file = $("photo-file").files[0];
  $("photo-file").value = "";
  if (!file) return;
  $("found-note").textContent = "Looking at the photo…";
  $("moments").innerHTML = "";
  $("play-all").hidden = true;
  try {
    const r = await fetch("/api/recordings/search/photo", { method: "POST", body: file,
                                                             headers: { "Content-Type": file.type || "image/jpeg" } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { found = null; $("found-note").textContent = d.detail || "The photo could not be searched."; return; }
    found = d;
    drawFound();
  } catch { $("found-note").textContent = "The photo could not be sent."; }
});

function drawFound() {
  const d = found, notes = [d.explanation.replace(/\.?$/, ".")];
  if (!d.found) notes.push(d.how === "photo" ? "Nobody recorded looks enough like the person in the photo." : "Nothing found.");
  else if (!d.on_video) notes.push(`Found ${d.found}, but none of them is on video: ` + (d.recording
    ? `recordings are kept ${d.keep_days} days, and only while people are in view.` : "recording is turned off."));
  else notes.push(`Found ${d.found}, ${d.on_video} on video` + (d.not_on_video ? ` (${d.not_on_video} not recorded)` : "")
    + ` · ${d.moments.length} moment${d.moments.length === 1 ? "" : "s"}.`);
  $("found-note").textContent = notes.join(" ");
  $("play-all").hidden = d.moments.length < 2;
  $("moments").innerHTML = d.moments.map((m, k) => {
    const day = m.start.slice(0, 10), t = clock(ms(m.start));
    const chips = m.items.slice(0, 6).map(i => `<span class="chip${i.labels_differ ? " differs" : ""}"
      title="${i.labels_differ ? "looks similar, but is labeled differently" : ""}">${esc(i.text)}${
        i.similarity !== undefined ? ` · ${Math.round(i.similarity * 100)}% alike` : ""}</span>`).join("")
      + (m.items.length > 6 ? `<span class="chip">+${m.items.length - 6}</span>` : "");
    const dl = data && data.admin ? m.parts.map((p, j) =>
      `<button data-dl="${k}:${j}">Download${m.parts.length > 1 ? ` ${j + 1}/${m.parts.length}` : ""}</button>`).join("") : "";
    return `<div class="moment" data-k="${k}">
      ${m.picture ? `<img src="/crops/${encodeURIComponent(m.picture)}" alt="" loading="lazy">` : '<span class="pic-none"></span>'}
      <div class="what"><b>${esc(m.camera)} · ${day} ${t}</b>
        <small>${length(m.length_s)} · ${count(m.items)}${m.parts.length > 1 ? ` · ${m.parts.length} parts` : ""}</small>
        <div class="chips">${chips}</div></div>
      <div class="actions"><button class="primary" data-play="${k}">▶ Play</button>${dl}</div></div>`;
  }).join("");
}

$("moments").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.play !== undefined) { queue = null; playMoment(Number(b.dataset.play), 0); }
  if (b.dataset.dl !== undefined) {
    const [k, j] = b.dataset.dl.split(":").map(Number), p = found.moments[k].parts[j];
    location.href = `/api/recordings/${p.recording}/download?start=${p.video_s}&end=${p.video_end_s}`;
  }
};
$("play-all").onclick = () => { queue = found.moments.map((_, k) => k).slice(1); playMoment(0, 0); };

// One part of a moment: show its day and camera (the bar and list), play from its start, stop at its end,
// then its next part, then (Play all) the next moment.
async function playMoment(k, j) {
  const m = found.moments[k], p = m.parts[j];
  document.querySelectorAll(".moment").forEach(el => el.classList.toggle("playing", Number(el.dataset.k) === k));
  if (!data || data.day !== p.start.slice(0, 10) || data.camera !== m.camera) await load(p.start.slice(0, 10), m.camera);
  const rec = data.recordings.find(x => x.id === p.recording) || { id: p.recording, start: p.start, open: false };
  const next = j + 1 < m.parts.length ? () => playMoment(k, j + 1)
    : queue && queue.length ? () => playMoment(queue.shift(), 0) : null;
  play(rec, p.offset_s, p.video_s, { videoEnd: p.video_end_s, seconds: Math.max(1, p.end_offset_s - p.offset_s), onEnd: next });
  $("now-note").textContent += ` · moment ${k + 1} of ${found.moments.length}` + (m.parts.length > 1 ? `, part ${j + 1} of ${m.parts.length}` : "");
}

// A link like /recordings?camera=cam1&at=2026-10-12T14:05:00 (from a person, an alert or the timeline) plays then.
(async () => {
  const at = params.get("at");
  await load(at ? at.slice(0, 10) : localDay(new Date()), params.get("camera"));
  if (at) playAt(ms(at));
})();
</script>
