<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/session.js"></script>
<style>
  /* --seq-1..6: one blue ramp for the heatmap, few -> many. Dark mode has its own steps, so "few" recedes
     into the dark surface and "many" stands out. The middle blues are skipped: no text color reaches 4.5:1 on
     them (light: steps 400-450, dark: 450-500); every step used gives the cell's number 5.1:1 or more. */
  .viz { --series-1: #2a78d6; --grid: #e6e6e3;
         --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #5598e7; --seq-5: #1c5cab; --seq-6: #104281;
         --seq-strong-ink: #ffffff; }
  @media (prefers-color-scheme: dark) { .viz { --series-1: #3987e5; --grid: #2e3440;
         --seq-1: #104281; --seq-2: #1c5cab; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #9ec5f4; --seq-6: #cde2fb;
         --seq-strong-ink: #0d1320; } }
  .heat { overflow-x: auto; }
  @media (min-width: 900px) { #whowhen-panel { grid-column: span 2; } }
  .heat table { border-collapse: separate; border-spacing: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .heat th { font-weight: 500; color: var(--muted); padding: 2px 6px; text-align: center; }
  .heat tr th:first-child { text-align: right; }
  .heat td { min-width: 34px; height: 22px; text-align: center; border-radius: 4px; color: var(--muted); }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filters label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 160px; }
  .tile .num { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .lbl { color: var(--muted); font-size: 12px; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: 220px; display: block; }
  .chart .axis text { fill: var(--muted); font-size: 11px; }
  .chart .grid line { stroke: var(--grid); }
  .chart .bar { fill: var(--series-1); }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .bar.hover { opacity: 0.75; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px;
         padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
  .breakdowns { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .hbars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 8px; align-items: center; font-size: 13px; }
  .hbars .track { height: 12px; }
  .hbars .fill { height: 12px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbars .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  table.data { border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.data td, table.data th { border-bottom: 1px solid var(--border); padding: 3px 12px 3px 0; text-align: left; }
  details { margin-top: 10px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>VisionLabeler</h1>
  <nav><a href="/">Live</a><a href="/review" class="admin-only">Review queue</a><a href="/reports" class="active admin-only">Reports</a><a href="/alerts" class="admin-only">Alerts</a><a href="/answer-key" class="admin-only">Answer key</a><a href="/audit" class="admin-only">Audit log</a></nav>
</header>
<main class="viz">
  <div class="filters">
    <label>From <input type="date" id="start"></label>
    <label>To <input type="date" id="end"></label>
    <label>Camera <select id="camera"><option value="">All cameras</option></select></label>
    <button id="today">Today</button>
    <button id="week">Last 7 days</button>
    <a id="csv" href="#"><button class="primary">Download CSV</button></a>
  </div>
  <div class="tiles" id="tiles"></div>
  <section class="panel">
    <h2 id="timeline-title">People per hour</h2>
    <div class="chart" id="timeline"></div>
    <details><summary>Show as a table</summary><div id="timeline-table"></div></details>
  </section>
  <section class="panel" id="typical-panel" style="margin-top:14px" hidden>
    <h2>A typical day: average people per hour</h2>
    <div class="chart" id="typical"></div>
  </section>
  <div class="breakdowns" style="margin-top:14px">
    <section class="panel" id="whowhen-panel" hidden>
      <h2>Who came at which hour</h2>
      <p class="hint" id="whowhen-hint"></p>
      <div class="heat" id="whowhen"></div>
    </section>
    <section class="panel" id="dwell-panel" hidden>
      <h2>How long people stayed</h2>
      <div class="hbars" id="dwell"></div>
    </section>
  </div>
  <section class="panel" id="zones-panel" style="margin-top:14px" hidden>
    <h2>Zones and counting lines</h2>
    <div id="zones"></div>
  </section>
  <h2 style="margin:18px 0 10px">What people looked like</h2>
  <div class="breakdowns" id="breakdowns"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const NAMES = { apparent_gender: "Gender (apparent)", age_range: "Age range (apparent)", age_group: "Age group",
  upper_color: "Top color", upper_type: "Top", lower_color: "Bottoms color", lower_type: "Bottoms",
  headwear: "Headwear", eyewear: "Eyewear", carrying: "Carrying" };
const iso = (d) => d.toISOString().slice(0, 10);
function localDay(offset) { const d = new Date(); d.setDate(d.getDate() + offset); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return iso(d); }

function params() {
  const p = new URLSearchParams({ start: $("start").value, end: $("end").value });
  if ($("camera").value) p.set("camera", $("camera").value);
  return p;
}

function label(t, unit) {
  const d = new Date(t);
  return unit === "hour" ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                         : d.toLocaleDateString([], { month: "short", day: "numeric" });
}

// Bar chart: thin bars, 2px gaps, rounded top, one hover tooltip per bar. rows: [{label, value, tip}].
// Drawn at the panel's real pixel width (and again on resize), so text is never stretched.
const charts = {};
function drawBars(id, rows, aria) {
  charts[id] = [rows, aria];
  const el = $(id);
  const W = Math.max(320, el.clientWidth), H = 220, L = 34, B = 24, T = 10;
  const n = rows.length;
  const max = Math.max(...rows.map(r => r.value), 0) || 1;
  const step = max >= 3 ? Math.ceil(max / 3) : Math.max(0.1, Math.ceil(max / 3 * 10) / 10);   // averages can be < 1
  const top = step * 3;
  const bw = (W - L) / n;
  const y = (v) => H - B - (H - B - T) * v / top;
  const ticks = [0, 1, 2, 3].map(i => +(step * i).toFixed(1));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">`;
  svg += '<g class="grid">' + ticks.map(v => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/>`).join("");
  svg += '</g><g class="axis">' + ticks.map(v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const every = Math.ceil(n / Math.max(2, Math.floor((W - L) / 70)));   // a label every ~70 px
  rows.forEach((r, i) => { if (i % every === 0)
    svg += `<text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(r.label)}</text>`; });
  svg += "</g>";
  rows.forEach((r, i) => {
    const x = L + i * bw + 1, w = Math.max(1, bw - 2), yy = y(r.value), h = H - B - yy;
    const rad = Math.min(4, w / 2, h);
    if (r.value) svg += `<path class="bar" data-i="${i}" d="M${x},${H - B} V${yy + rad} Q${x},${yy} ${x + rad},${yy} H${x + w - rad} Q${x + w},${yy} ${x + w},${yy + rad} V${H - B} Z"/>`;
  });
  // Hover areas on top of the bars, full column height so thin or short bars are easy to hit.
  rows.forEach((r, i) => {
    svg += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - B - T}" data-i="${i}"/>`;
  });
  svg += "</svg>";
  el.innerHTML = svg + '<div class="tip"></div>';
  const tip = el.querySelector(".tip");
  el.querySelectorAll(".hit").forEach(hit => {
    hit.addEventListener("mousemove", (e) => {
      const box = el.getBoundingClientRect();
      tip.style.display = "block";
      tip.style.left = (e.clientX - box.left) + "px";
      tip.style.top = (e.clientY - box.top) + "px";
      tip.textContent = rows[hit.dataset.i].tip;
      el.querySelectorAll(".bar").forEach(b => b.classList.toggle("hover", b.dataset.i === hit.dataset.i));
    });
    hit.addEventListener("mouseleave", () => {
      tip.style.display = "none";
      el.querySelectorAll(".bar.hover").forEach(b => b.classList.remove("hover"));
    });
  });
}

const people = (n) => `${n} ${n === 1 ? "person" : "people"}`;
const hh = (h) => `${String(h).padStart(2, "0")}:00`;

function drawTimeline(data) {
  const rows = data.timeline;
  drawBars("timeline", rows.map(r => ({ label: label(r.t, data.unit), value: r.count,
                                        tip: `${label(r.t, data.unit)}: ${people(r.count)}` })),
           `People per ${data.unit}`);
  $("timeline-title").textContent = `People per ${data.unit}`;
  $("timeline-table").innerHTML = '<table class="data"><tr><th>' + (data.unit === "hour" ? "Hour" : "Day")
    + '</th><th>People</th></tr>' + rows.filter(r => r.count).map(r =>
      `<tr><td>${esc(label(r.t, data.unit))}</td><td>${r.count}</td></tr>`).join("") + "</table>";
}

// Over several days: the hours of the day averaged, so the usual busy hours stand out.
function drawTypicalDay(data) {
  const show = data.days > 1 && data.total > 0;
  $("typical-panel").hidden = !show;
  if (!show) return;
  drawBars("typical", data.hours_of_day.map(r => {
    const avg = +(r.people / data.days).toFixed(1);
    return { label: hh(r.hour), value: avg, tip: `${hh(r.hour)}-${hh((r.hour + 1) % 24)}: ${avg} people a day on average` };
  }), "Average people per hour of the day");
}

// Heatmap, one blue ramp (light = few, dark = many). "All" has its own scale; the breakdown columns share
// one, so they can be compared with each other. Counts are written in the cells (this is also the table view).
const HEAT_COLS = [["people", "All"], ["man", "Man"], ["woman", "Woman"], ["child", "Child"], ["teen", "Teen"],
                   ["adult", "Adult"], ["senior", "Senior"]];
function drawWhoWhen(data) {
  const rows = data.hours_of_day.filter(r => r.people);
  $("whowhen-panel").hidden = !rows.length;
  if (!rows.length) return;
  const css = getComputedStyle(document.querySelector(".viz"));
  const ramp = [1, 2, 3, 4, 5, 6].map(i => css.getPropertyValue(`--seq-${i}`).trim());
  // The number in a cell: whichever of the two inks has more contrast on that shade (WCAG luminance).
  const lum = (hex) => {
    const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const ratio = (a, b) => (Math.max(lum(a), lum(b)) + 0.05) / (Math.min(lum(a), lum(b)) + 0.05);
  const inks = [getComputedStyle(document.body).getPropertyValue("--text").trim(), css.getPropertyValue("--seq-strong-ink").trim()];
  const ink = ramp.map(bg => ratio(bg, inks[0]) >= ratio(bg, inks[1]) ? inks[0] : inks[1]);
  const maxAll = Math.max(...rows.map(r => r.people));
  const maxPart = Math.max(1, ...rows.flatMap(r => HEAT_COLS.slice(1).map(([k]) => r[k])));
  const cell = (v, max, title) => {
    if (!v) return `<td title="${esc(title)}">·</td>`;
    const i = Math.min(5, Math.floor(v / max * 6 - 1e-9));
    return `<td style="background:${ramp[i]};color:${ink[i]}" title="${esc(title)}">${v}</td>`;
  };
  $("whowhen-hint").textContent = data.days > 1 ? `Total over ${data.days} days.` : "";
  $("whowhen").innerHTML = '<table><tr><th>Hour</th>' + HEAT_COLS.map(([, n]) => `<th>${n}</th>`).join("") + "</tr>"
    + rows.map(r => `<tr><th>${hh(r.hour)}</th>` + HEAT_COLS.map(([k, n], j) =>
        cell(r[k], j ? maxPart : maxAll, `${hh(r.hour)} · ${n}: ${people(r[k])}`)).join("") + "</tr>").join("")
    + "</table>";
}

function drawDwell(data) {
  const rows = data.dwell, total = rows.reduce((a, r) => a + r.count, 0);
  $("dwell-panel").hidden = !total;
  if (!total) return;
  const max = Math.max(...rows.map(r => r.count));
  $("dwell").innerHTML = rows.map(r => `
    <span>${esc(r.label)}</span>
    <div class="track" title="${esc(r.label)}: ${people(r.count)} (${Math.round(r.count / total * 100)}%)">
      ${r.count ? `<div class="fill" style="width:${r.count / max * 100}%"></div>` : ""}</div>
    <span class="n">${r.count}</span>`).join("");
}

function duration(s) {
  if (s == null) return "-";
  s = Math.round(s);
  return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s`;
}

// Areas count entries and the average stay; lines count crossings each way.
function drawZones(data) {
  const rows = data.zones || [];
  $("zones-panel").hidden = !rows.length;
  $("zones").innerHTML = '<table class="data"><tr><th>Zone</th><th>Camera</th><th>Entered / in</th>'
    + '<th>Left / out</th><th>Average stay</th></tr>' + rows.map(z => {
      const line = z.in + z.out > 0 && z.enter === 0;
      return `<tr><td>${esc(z.zone)}</td><td>${esc(z.camera)}</td>`
        + (line ? `<td>${z.in} in</td><td>${z.out} out</td><td>-</td>`
                : `<td>${z.enter}</td><td>${z.exit}</td><td>${duration(z.avg_dwell_s)}</td>`) + "</tr>";
    }).join("") + "</table>";
}

function drawBreakdowns(data) {
  const blocks = Object.entries(data.attributes).map(([name, rows]) => {
    const total = rows.reduce((a, r) => a + r.count, 0);
    const max = rows[0].count;
    const lines = rows.slice(0, 8).map(r => `
      <span>${esc(r.value)}</span>
      <div class="track" title="${esc(r.value)}: ${r.count} (${Math.round(r.count / total * 100)}%)">
        <div class="fill" style="width:${r.count / max * 100}%"></div></div>
      <span class="n">${r.count}</span>`).join("");
    return `<section class="panel"><h2>${esc(NAMES[name] || name)}</h2><div class="hbars">${lines}</div></section>`;
  });
  $("breakdowns").innerHTML = blocks.join("") || '<div class="empty">No labeled people in this period.</div>';
}

async function load() {
  $("csv").href = "/api/reports/export.csv?" + params();
  const r = await fetch("/api/reports/summary?" + params());
  if (!r.ok) { $("tiles").innerHTML = '<div class="empty">Could not load the report.</div>'; return; }
  const data = await r.json();
  const busiest = data.timeline.reduce((a, b) => (b.count > a.count ? b : a), { count: 0 });
  $("tiles").innerHTML = `
    <div class="tile"><div class="num">${data.total}</div><div class="lbl">people</div></div>
    <div class="tile"><div class="num">${busiest.count ? esc(label(busiest.t, data.unit)) : "-"}</div>
      <div class="lbl">busiest ${data.unit}${busiest.count ? ` (${busiest.count})` : ""}</div></div>
    <div class="tile"><div class="num">${Object.keys(data.cameras).length}</div><div class="lbl">cameras with people</div></div>`;
  const g = data.engagement;
  if (g && g.people) $("tiles").innerHTML += `
    <div class="tile"><div class="num">${duration(g.avg_in_view_s)}</div><div class="lbl">average time in view</div></div>
    <div class="tile"><div class="num">${Math.round(g.facing_share * 100)}%</div>
      <div class="lbl">of that time facing the camera</div></div>
    <div class="tile"><div class="num">${g.looked} <small>of ${g.people}</small></div>
      <div class="lbl">looked at the camera ${g.looked_s} s or more</div></div>`;
  drawTimeline(data);
  drawTypicalDay(data);
  drawWhoWhen(data);
  drawDwell(data);
  drawZones(data);
  drawBreakdowns(data);
}

async function init() {
  const cams = await (await fetch("/api/cameras")).json();
  for (const c of cams) $("camera").add(new Option(c.name, c.name));
  $("start").value = $("end").value = localDay(0);
  for (const id of ["start", "end", "camera"]) $(id).onchange = load;
  $("today").onclick = () => { $("start").value = $("end").value = localDay(0); load(); };
  $("week").onclick = () => { $("start").value = localDay(-6); $("end").value = localDay(0); load(); };
  load();
}
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    for (const [id, [rows, aria]] of Object.entries(charts)) if (!$(id).closest("[hidden]")) drawBars(id, rows, aria);
  }, 150);
});
init();
</script>
</body>
</html>
