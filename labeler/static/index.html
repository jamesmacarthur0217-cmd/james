<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionLabeler</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/session.js"></script>
</head>
<body>
<header>
  <h1>VisionLabeler</h1>
  <nav><a href="/" class="active">Live</a><a href="/recordings">Recordings</a><a href="/summary">Summary</a><a href="/review" class="admin-only">Review queue</a><a href="/reports" class="admin-only">Reports</a><a href="/alerts" class="admin-only">Alerts</a><a href="/answer-key" class="admin-only">Answer key</a><a href="/check" class="admin-only">Check</a><a href="/audit" class="admin-only">Audit log</a><a href="/import" class="admin-only">Import</a><a href="/settings" class="admin-only">Settings</a><a href="/health">Health</a></nav>
  <div class="status" id="status">connecting…</div>
  <button id="stop" class="admin-only" title="Finish labeling the people in view, save, and close the app">Stop</button>
</header>
<div class="today" id="today" hidden></div>
<main class="layout">
  <section class="panel">
    <div class="panel-head">
      <h2><span class="live-dot" id="live-dot"></span>Live camera</h2>
      <div class="cam-tabs" id="cam-tabs" hidden></div>
      <span class="muted" id="live-caption"></span>
      <button id="zones-btn" class="admin-only" title="Draw areas and counting lines on this camera">Zones</button>
      <button id="fullscreen" title="Show the live view full screen">Full screen</button>
    </div>
    <div class="banner problem" id="cam-problem" hidden></div>
    <div class="banner" id="pic-problem" hidden></div>
    <div class="video" id="video">
      <img id="live" src="/stream" alt="Live camera feed with labels">
      <svg id="zone-draw" hidden></svg>
    </div>
    <div class="zone-bar" id="zone-bar" hidden>
      <p class="hint" id="zone-hint"></p>
      <div class="search">
        <select id="zone-kind">
          <option value="area">Area: click its corners</option>
          <option value="line">Counting line: click 2 points</option>
        </select>
        <input id="zone-name" placeholder="Name, e.g. door" maxlength="100">
        <label id="zone-role-label" title="What the place is, so the safety checks know what is normal there (a bed or
          sofa: someone lying there is not a fall)">Role <select id="zone-role"><option value="">none</option></select></label>
        <label id="zone-max-label" title="Too crowded: a safety check when more people than this stay in the area 30 s
          (empty: no limit)">At most <input type="number" id="zone-max" min="1" max="10000" step="1" style="width:5em"> people</label>
        <button id="zone-undo">Undo point</button>
        <button id="zone-save" class="primary" disabled>Save</button>
        <span class="muted" id="zone-msg"></span>
      </div>
      <div class="zone-list" id="zone-list"></div>
    </div>
  </section>
  <div class="side">
  <section class="panel">
    <h2>In view now</h2>
    <div class="now" id="now"><div class="empty">Nobody in view.</div></div>
  </section>
  <section class="panel">
    <h2>People seen</h2>
    <form class="search" id="q-form">
      <input id="q" placeholder="Ask, e.g. who wore a red top after 3pm?  or describe: man in a beige coat"
             style="flex:1; min-width:180px">
      <button class="primary">Ask</button>
      <button type="button" id="photo-btn" title="Find people who look like the person in a picture (it is not stored)">Search by photo</button>
      <input type="file" id="photo-file" accept="image/jpeg,image/png" hidden>
    </form>
    <div class="search">
      <select id="f-camera" hidden title="Which camera's people (live cameras and imported videos)"><option value="">All cameras</option></select>
      <select id="f-name"><option value="">Filter by attribute…</option></select>
      <select id="f-value" disabled><option value="">value</option></select>
      <button id="f-clear">Clear</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="select-bar admin-only">
      <label><input type="checkbox" id="sel-all"> Select all shown</label>
      <button id="del-selected" class="danger" disabled>Delete selected</button>
      <button id="del-all" class="danger-quiet" title="Delete every recorded person">Delete all…</button>
    </div>
    <div class="people" id="people"><div class="empty">No one yet.</div></div>
  </section>
  <section class="panel" id="vehicles-panel" hidden>
    <h2>Vehicles seen</h2>
    <div class="search">
      <select id="v-kind" title="Kind"><option value="">All kinds</option><option value="car">cars (with SUVs, vans, pickups)</option>
        <option value="SUV">SUVs</option><option value="van">vans</option><option value="pickup">pickups</option>
        <option value="lorry">lorries</option><option value="bus">buses</option><option value="motorbike">motorbikes</option>
        <option value="bicycle">bicycles</option></select>
      <select id="v-color" title="Color"><option value="">Any color</option></select>
      <input type="date" id="v-day" title="Day">
      <button id="v-clear">Clear</button>
    </div>
    <div class="banner" id="v-banner" hidden></div>
    <div class="select-bar admin-only">
      <button id="v-del" class="danger" disabled>Delete selected</button>
    </div>
    <div class="people" id="vehicles"><div class="empty">No vehicles yet.</div></div>
  </section>
  <section class="panel" id="animals-panel" hidden>
    <h2>Animals seen</h2>
    <div class="search">
      <select id="a-kind" title="Kind"><option value="">All animals</option><option value="dog">dogs</option>
        <option value="cat">cats</option><option value="bird">birds</option></select>
      <select id="a-color" title="Color"><option value="">Any color</option></select>
      <input type="date" id="a-day" title="Day">
      <button id="a-clear">Clear</button>
    </div>
    <div class="banner" id="a-banner" hidden></div>
    <div class="select-bar admin-only">
      <button id="a-del" class="danger" disabled>Delete selected</button>
    </div>
    <div class="people" id="animals"><div class="empty">No animals yet.</div></div>
  </section>
  </div>
</main>
<div id="player" class="player" hidden>
  <div class="player-box">
    <div class="player-head"><b id="player-title"></b><button id="player-close">Close</button></div>
    <video id="player-video" controls playsinline></video>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
let schema = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadSchema() {
  schema = await (await fetch("/api/schema")).json();
  for (const name of Object.keys(schema.fields)) {
    $("f-name").add(new Option(name.replace(/_/g, " "), name));
  }
}

$("f-name").onchange = () => {
  const sel = $("f-value"); sel.innerHTML = "";
  const name = $("f-name").value;
  sel.disabled = !name;
  sel.add(new Option("value", ""));
  if (name) for (const v of schema.fields[name]) sel.add(new Option(v, v));
  refresh();
};
$("f-value").onchange = () => { view = { kind: "recent" }; refresh(); };
$("f-camera").onchange = () => { view = { kind: "recent" }; refresh(); };
$("f-clear").onclick = () => { $("f-name").value = ""; $("f-camera").value = ""; $("q").value = ""; view = { kind: "recent" }; $("f-name").onchange(); };

// What the list shows: recent people (auto-refreshing), a text search, or look-alikes of one person.
let view = { kind: "recent" };
$("q-form").onsubmit = (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  view = q ? { kind: "ask", q } : { kind: "recent" };
  refresh();
};
$("people").addEventListener("click", (e) => {
  if (e.target.dataset.video) { playVideo("/clips/" + encodeURIComponent(e.target.dataset.video), e.target.dataset.title); return; }
  if (e.target.dataset.original) { playVideo(`/api/tracks/${e.target.dataset.original}/original`, e.target.dataset.title); return; }
  const id = e.target.dataset.similar, tl = e.target.dataset.timeline;
  if (id) { view = { kind: "similar", id: Number(id) }; refresh(); }
  if (tl) { view = { kind: "timeline", id: Number(tl) }; refresh(); }
});
// A person's video plays in an overlay: the people list is redrawn every few seconds, which would cut it off.
function playVideo(src, title) {
  // An imported person's original is cut from the file on first view: a few seconds.
  $("player-title").textContent = `Person ${title} · preparing the video…`;
  $("player-video").onloadeddata = () => { $("player-title").textContent = `Person ${title}`; };
  $("player-video").onerror = () => { $("player-title").textContent = `Person ${title} · the video could not be loaded`; };
  $("player-video").src = src;
  $("player").hidden = false;
  $("player-video").play().catch(() => {});
}
function closeVideo() { $("player-video").pause(); $("player-video").removeAttribute("src"); $("player").hidden = true; }
$("player-close").addEventListener("click", closeVideo);
$("player").addEventListener("click", (e) => { if (e.target.id === "player") closeVideo(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("player").hidden) closeVideo(); });

// Today at a glance (labeler/today.py), once a minute.
async function loadToday() {
  let d;
  try { d = await (await fetch("/api/today")).json(); } catch { return; }
  const tile = (num, label, cls = "") => `<div class="today-tile ${cls}"><b>${num}</b><span>${label}</span></div>`;
  const usual = d.usual_by_now == null ? "no earlier weeks to compare yet"
    : `usually ${d.usual_by_now} by now (${d.usual_day} a whole day; ${d.usual_from_days} earlier ${d.usual_from_days === 1 ? "week" : "weeks"})`;
  const h = d.busiest_hour;
  let html = '<span id="arming-slot"></span>' + tile(d.people, `people today · ${usual}`)
    + tile(h ? `${String(h.hour).padStart(2, "0")}:00` : "–", h ? `busiest hour (${h.people} people)` : "busiest hour");
  if (d.alerts !== undefined) {
    html += `<a href="/alerts">${tile(d.alerts, d.alerts === 1 ? "alert today" : "alerts today", d.alerts ? "warn" : "")}</a>`;
    const p = d.camera_problems_now ? `${d.camera_problems} (${d.camera_problems_now} now)` : d.camera_problems;
    html += `<a href="/alerts">${tile(p, "camera problems today", d.camera_problems_now ? "warn" : "")}</a>`;
    if (d.postgres) {
      const age = d.backup_age_h;
      html += `<a href="/health">${tile(age == null ? "none" : age < 24 ? `${Math.round(age)} h` : `${(age / 24).toFixed(1)} d`,
        "since the last backup", age == null || age > 48 ? "warn" : "")}</a>`;
    }
  }
  html += `<a href="/summary?period=today">${tile("Summary", "what happened today, last night, while away")}</a>`;
  $("today").innerHTML = html;
  $("today").hidden = false;
  drawArmingTile();
}

// Home / Away (static/session.js keeps it up to date): a tile first in the strip; clicking it switches (asks first).
function drawArmingTile() {
  const slot = $("arming-slot"), s = window.VL && window.VL.arming;
  if (!slot || !s) return;
  slot.innerHTML = `<button class="today-tile ${s.mode}" title="Click to switch"><b>${s.mode === "away" ? "Away" : "Home"}</b>
    <span>${(window.VL.armingText(s).split(" · ")[0].replace(/^(Home|Away) ?/, "") || "Home / Away")
            + (s.next ? ` · next: ${s.next.mode === "away" ? "Away" : "Home"} ${new Date(s.next.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` : "")}</span></button>`;
  slot.querySelector("button").addEventListener("click", () => window.VL.switchArming());
}
document.addEventListener("vl-arming", drawArmingTile);

// Search by photo: the picture is sent as it is and not stored; the server finds the person in it.
$("photo-btn").addEventListener("click", () => $("photo-file").click());
$("photo-file").addEventListener("change", async () => {
  const file = $("photo-file").files[0];
  $("photo-file").value = "";
  if (!file) return;
  $("banner").hidden = false;
  $("banner").textContent = "Looking at the photo…";
  try {
    const r = await fetch("/api/search/photo?limit=20", { method: "POST", body: file,
                                                         headers: { "Content-Type": file.type || "image/jpeg" } });
    const out = await r.json();
    if (!r.ok) { $("banner").textContent = out.detail || "The photo could not be searched."; return; }
    view = { kind: "photo", people: out.people, found: out.found };
    refresh();
  } catch { $("banner").textContent = "The photo could not be sent."; }
});

$("banner").addEventListener("click", (e) => {
  if (e.target.dataset.back !== undefined) { view = { kind: "recent" }; $("q").value = ""; refresh(); }
});

// Turn attributes into readable phrases: "age 25-34", "red t-shirt", "carrying backpack".
function phrases(a) {
  const known = (n) => a[n] && !["unknown", "none", "no"].includes(a[n].value) ? a[n].value : null;
  const out = [];
  const add = (text, names) => {
    const items = names.filter(n => a[n]).map(n => a[n]);
    out.push({
      text,
      review: items.some(x => x.needs_review),
      human: items.length > 0 && items.every(x => x.source === "human"),
      title: names.filter(n => a[n]).map(n =>
        `${n}: ${a[n].value} (${a[n].source}, ${Math.round(a[n].confidence * 100)}%)`).join("\n"),
    });
  };
  if (known("age_range")) add(`age ${known("age_range")}`, ["age_range"]);
  if (known("age_group")) add(known("age_group"), ["age_group"]);
  if (known("apparent_gender")) add(known("apparent_gender"), ["apparent_gender"]);
  for (const part of ["upper", "lower"]) {
    const color = known(part + "_color"), type = known(part + "_type");
    if (color || type) add([color, type || (part === "upper" ? "top" : "bottoms")].filter(Boolean).join(" "),
                           [part + "_color", part + "_type"]);
  }
  if (known("headwear")) add(known("headwear"), ["headwear"]);
  if (known("eyewear")) add(known("eyewear"), ["eyewear"]);
  if (a.face_mask && a.face_mask.value === "yes") add("face mask", ["face_mask"]);
  if (known("carrying")) add("carrying " + known("carrying").replace(/,/g, ", "), ["carrying"]);
  if (known("mobility_aid")) add("using " + known("mobility_aid").replace(/,/g, ", "), ["mobility_aid"]);
  return out;
}

async function fetchTracks() {
  if (view.kind === "ask") {
    $("banner").hidden = false;
    $("banner").innerHTML = "Thinking…";
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ question: view.q, limit: 30 }) });
    if (r.ok) {
      const res = await r.json();
      if (res.animals) {    // a question about animals: the answer is in the Animals list
        animalView = { kind: "ask", items: res.animals, explanation: `${res.explanation} · ${res.total} found` };
        drawAnimals();
        $("animals-panel").hidden = false;
        $("animals-panel").scrollIntoView({ behavior: "smooth", block: "start" });
        view.explanation = `${res.explanation} · ${res.total} found: see Animals seen below`;
        return [];
      }
      if (res.vehicles) {   // a question about vehicles: the answer is in the Vehicles list
        vehicleView = { kind: "ask", items: res.vehicles, explanation: `${res.explanation} · ${res.total} found` };
        drawVehicles();
        $("vehicles-panel").hidden = false;
        $("vehicles-panel").scrollIntoView({ behavior: "smooth", block: "start" });
        view.explanation = `${res.explanation} · ${res.total} found: see Vehicles seen below`;
        return [];
      }
      view.explanation = `${res.explanation} · ${res.total} found`;
      return res.people;
    }
    view = { kind: "search", q: view.q };   // no model: fall back to appearance search
  }
  if (view.kind === "search") {
    const r = await fetch("/api/search?" + new URLSearchParams({ q: view.q, limit: 20 }));
    return r.ok ? r.json() : [];
  }
  if (view.kind === "photo") return view.people;
  if (view.kind === "similar") {
    const r = await fetch(`/api/tracks/${view.id}/similar?limit=10`);
    return r.ok ? r.json() : [];
  }
  if (view.kind === "timeline") {
    const r = await fetch(`/api/tracks/${view.id}/timeline`);
    return r.ok ? r.json() : [];
  }
  const p = new URLSearchParams({ limit: 30 });
  if ($("f-name").value && $("f-value").value) { p.set("name", $("f-name").value); p.set("value", $("f-value").value); }
  if ($("f-camera").value) p.set("camera", $("f-camera").value);
  return (await fetch("/api/tracks?" + p)).json();
}

// Selection for deleting: kept across refreshes, so ticks survive the 3-second auto-refresh.
const selected = new Set();
let shownIds = [];
let shownHtml = null;   // the people list as drawn last (refresh redraws only when it changes)

function updateSelectBar() {
  for (const id of [...selected]) if (!shownIds.includes(id)) selected.delete(id);
  $("del-selected").disabled = selected.size === 0;
  $("del-selected").textContent = selected.size ? `Delete selected (${selected.size})` : "Delete selected";
  $("sel-all").checked = shownIds.length > 0 && shownIds.every(id => selected.has(id));
  $("sel-all").indeterminate = selected.size > 0 && !$("sel-all").checked;
}

$("people").addEventListener("change", (e) => {
  if (!e.target.matches("input[data-select]")) return;
  const id = Number(e.target.dataset.select);
  e.target.checked ? selected.add(id) : selected.delete(id);
  e.target.closest(".person").classList.toggle("is-selected", e.target.checked);
  updateSelectBar();
});
$("sel-all").onchange = () => {
  if ($("sel-all").checked) shownIds.forEach(id => selected.add(id)); else selected.clear();
  document.querySelectorAll("input[data-select]").forEach(cb => {
    cb.checked = selected.has(Number(cb.dataset.select));
    cb.closest(".person").classList.toggle("is-selected", cb.checked);
  });
  updateSelectBar();
};

async function deletePeople(body, what) {
  const r = await fetch("/api/tracks/delete", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { alert("Delete failed"); return; }
  const res = await r.json();
  selected.clear();
  await refresh();
  status();
  $("banner").hidden = false;
  $("banner").innerHTML = `Deleted ${res.deleted} ${res.deleted === 1 ? "person" : "people"} (${what}), `
    + `with ${res.pictures_removed} file${res.pictures_removed === 1 ? "" : "s"} (pictures and videos). `
    + '<a href="#" data-back>OK</a>';
}

$("del-selected").onclick = () => {
  const ids = [...selected];
  if (!ids.length) return;
  if (!confirm(`Permanently delete ${ids.length} ${ids.length === 1 ? "person" : "people"}, `
               + "with their pictures, labels and review history? This cannot be undone.")) return;
  deletePeople({ ids }, "selected");
};
$("del-all").onclick = () => {
  const answer = prompt("This permanently deletes EVERY recorded person, with all pictures, labels and "
                        + "review history.\n\nType DELETE ALL to confirm:");
  if (answer !== "DELETE ALL") return;
  deletePeople({ everything: true }, "everything");
};

async function refresh() {
  const tracks = await fetchTracks();
  shownIds = tracks.map(t => t.id);
  const back = ' <a href="#" data-back>Back to recent</a>';
  $("banner").hidden = view.kind === "recent";
  if (view.kind === "search") $("banner").innerHTML = `Best matches for “${esc(view.q)}”, closest first.` + back;
  if (view.kind === "ask") $("banner").innerHTML = esc(view.explanation) + back;
  if (view.kind === "similar") $("banner").innerHTML = `People who look most like #${view.id}.` + back;
  if (view.kind === "photo") $("banner").innerHTML = `People who look like the person in your photo (${esc(view.found)}), `
    + "closest first. Same clothes can be a different person." + back;
  if (view.kind === "timeline") $("banner").innerHTML = `Where #${view.id} may have been seen, in time order: `
    + "look-alikes from all cameras, without ones seen elsewhere at the same time. Same clothes can be a "
    + "different person." + back;
  const html = tracks.length ? tracks.map(t => {
    const chips = phrases(t.attributes)
      .map(p => `<span class="chip ${p.review ? "review" : ""} ${p.human ? "human" : ""}"
         title="${esc(p.title)}">${esc(p.text)}</span>`).join("");
    const when = t.started_at.replace("T", " ");
    return `<div class="person${selected.has(t.id) ? " is-selected" : ""}">
      <input type="checkbox" data-select="${t.id}" ${selected.has(t.id) ? "checked" : ""}
             aria-label="Select person ${t.id}">
      ${t.crop ? `<img src="/crops/${encodeURIComponent(t.crop)}?v=${t.status}${encodeURIComponent(t.ended_at || "")}" alt="">` : `<img alt="">`}
      <div><div class="meta">#${t.id}${cameraNames.length > 1 && t.camera ? ` · ${esc(t.camera)}` : ""} · ${when}${t.source ? ` · in ${esc(t.source.file)} at ${mmss(t.source.offset_s)}` : ""} · ${t.status}${t.low_light ? " · low light" : ""}${score(t)}</div>
      <div class="chips">${chips || '<span class="chip">labeling…</span>'}</div>
      <button class="link" data-similar="${t.id}">Look-alikes</button>
      <button class="link" data-timeline="${t.id}">Timeline</button>${!t.source && t.camera ? ` <a class="link"
        href="/recordings?camera=${encodeURIComponent(t.camera)}&amp;at=${encodeURIComponent(t.started_at)}">▶ Recording</a>` : ""}${t.source ? ` <button class="link admin-only"
        data-original="${t.id}" data-title="#${t.id}, in ${esc(t.source.file)} at ${mmss(t.source.offset_s)}">▶ Original</button>` : ""}${(t.videos || []).map((v, i, all) =>
        ` <button class="link" data-video="${esc(v)}" data-title="#${t.id}${all.length > 1 ? `, visit ${i + 1}` : ""}">▶ Video${all.length > 1 ? " " + (i + 1) : ""}</button>`).join("")}</div></div>`;
  }).join("") : '<div class="empty">No matching people.</div>';
  // The list is refreshed every 3 s: replace it only when something changed, so buttons and checkboxes are not
  // swapped under the mouse (a click could miss) and the list does not flicker.
  if (html !== shownHtml) {
    $("people").innerHTML = html;
    shownHtml = html;
  }
  updateSelectBar();
}

function gap(s) {
  if (s == null) return "";
  if (s < 60) return " · right after";
  if (s < 3600) return ` · ${Math.round(s / 60)} min later`;
  return ` · ${(s / 3600).toFixed(1)} h later`;
}

function score(t) {
  if (view.kind === "timeline") return t.anchor ? `${gap(t.gap_s)} · <b>this person</b>`
                                                : `${gap(t.gap_s)} · <b>similarity ${t.similarity.toFixed(2)}</b>`;
  if (t.similarity === undefined) return "";
  const differ = t.labels_differ ? ' · <span style="color:var(--warn)">looks similar, labels differ</span>' : "";
  return ` · <b>similarity ${t.similarity.toFixed(2)}</b>${differ}`;
}

// The health check (labeler/healthcheck.py) as a link to the Health page; every 30 s, as it also asks Ollama.
let healthLink = "";
async function healthStatus() {
  try {
    const h = await (await fetch("/api/health")).json();
    const n = h.problems.length;
    healthLink = n ? `<a href="/health" style="color:var(--warn)"><b>${n} ${n === 1 ? "problem" : "problems"}</b></a> · `
      : `<a href="/health" style="color:inherit">health OK</a> · `;
  } catch { healthLink = ""; }
}

async function status() {
  try {
    const s = await (await fetch("/api/status?" + camParam())).json();
    let warn = s.blank_picture ? '<b style="color:var(--warn)">no picture from camera</b> · ' : "";
    if (s.disk_low) warn = `<b style="color:var(--warn)">disk almost full (${s.disk_free_gb} GB free)</b> · ` + warn;
    const down = (s.cameras || []).filter(c => !c.running).map(c => c.camera);
    if (down.length) warn = `<b style="color:var(--warn)">camera not running: ${down.map(esc).join(", ")}</b> · ` + warn;
    $("status").innerHTML = healthLink + warn + `mode <b>${s.mode}</b> · <b>${s.fps ?? "-"}</b> fps`
      + (s.idle ? ' <span class="muted" title="Nobody in view for a while: the camera is checked a few times a second to save power; the first person seen brings it back to full speed.">(idle)</span>' : "")
      + ` · <b>${s.active_people ?? 0}</b> in view · `
      + `VLM queue <b>${s.vlm_enabled ? s.vlm_queue : "off"}</b> · <b>${s.tracks}</b> people · `
      + `<a href="/review" class="admin-only"><b>${s.needs_review}</b> to review</a>`;
    showCameraProblems(s.camera_problems || []);
    showPictureProblems(s.cameras || []);
  } catch { $("status").textContent = "disconnected"; }
}

// The camera picture check (labeler/picture_check.py): a banner while a problem has lasted most of 10 minutes.
function showPictureProblems(cameras) {
  const lines = [];
  for (const c of cameras) {
    for (const [code, since] of Object.entries((c.picture && c.picture.lasting) || {}))
      lines.push(`<b>Camera ${esc(c.camera)}:</b> ${esc(c.picture.advice[code])} <span class="muted">(since ${clock(since)})</span>`);
  }
  $("pic-problem").hidden = !lines.length;
  $("pic-problem").innerHTML = lines.join("<br>")
    + (lines.length ? ' <a href="/settings" class="admin-only">Check the picture</a>' : "");
}

// Camera problems (labeler/health.py): a banner while they last, a pop-up when a new one starts.
const seenProblems = new Set();
let problemsLoaded = false;
function clock(iso) { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function showCameraProblems(problems) {
  $("cam-problem").hidden = !problems.length;
  $("cam-problem").innerHTML = problems.map(p =>
    `<b>${p.camera === "PC" ? "PC" : "Camera " + esc(p.camera)}:</b> ${esc(p.message)} (since ${clock(p.started_at)})`).join("<br>");
  for (const p of problems) {
    if (seenProblems.has(p.id)) continue;
    seenProblems.add(p.id);
    if (!problemsLoaded) continue;   // already going on when the page opened: banner only
    const t = document.createElement("div");
    t.className = "toast";
    // The PC watch (labeler/pcwatch.py) reports the PC's own problems the same way, as the camera "PC".
    t.innerHTML = `<div><b>${p.camera === "PC" ? "PC problem" : "Camera problem · " + esc(p.camera)}</b><br>${esc(p.message)}</div>`;
    t.onclick = () => t.remove();
    $("toasts").prepend(t);
    setTimeout(() => t.remove(), 20000);
  }
  problemsLoaded = true;
}

// Zones (admin): click on the live picture to draw an area or a counting line. Points are stored as
// fractions of the picture. The picture keeps its shape inside the frame (black bars), so clicks are
// measured against where the picture really is.
const zoneDraw = { on: false, points: [] };
const ZONE_HINT = {
  area: "Click the corners of the area on the picture, then name it and Save. People in it are counted, with how long they stay.",
  line: "Click 2 points across the way people walk. The arrow shows the \"in\" direction; click the points the other way round to flip it.",
};
function zoneCamera() { return camera || liveNames[0] || "cam1"; }

function pictureBox() {
  const img = $("live"), r = img.getBoundingClientRect(), v = $("video").getBoundingClientRect();
  const iw = img.naturalWidth || 16, ih = img.naturalHeight || 9;
  const scale = Math.min(r.width / iw, r.height / ih);
  const w = iw * scale, h = ih * scale;
  return { left: r.left - v.left + (r.width - w) / 2, top: r.top - v.top + (r.height - h) / 2, width: w, height: h };
}

function drawZonePreview() {
  const svg = $("zone-draw"), b = pictureBox();
  Object.assign(svg.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px", height: b.height + "px" });
  svg.setAttribute("viewBox", `0 0 ${b.width} ${b.height}`);
  const px = zoneDraw.points.map(([x, y]) => [x * b.width, y * b.height]);
  const kind = $("zone-kind").value;
  let html = "";
  if (px.length > 1) {
    const pts = px.map(p => p.join(",")).join(" ");
    html += kind === "area" && px.length > 2 ? `<polygon points="${pts}" class="zd-shape"/>`
                                             : `<polyline points="${pts}" class="zd-shape"/>`;
  }
  if (kind === "line" && px.length === 2) {
    const [[ax, ay], [bx, by]] = px, mx = (ax + bx) / 2, my = (ay + by) / 2;
    const nx = -(by - ay), ny = bx - ax, n = Math.hypot(nx, ny) || 1;
    const tx = mx + nx / n * 34, ty = my + ny / n * 34;
    html += `<line x1="${mx}" y1="${my}" x2="${tx}" y2="${ty}" class="zd-arrow"/>`
         + `<circle cx="${tx}" cy="${ty}" r="4" class="zd-tip"/><text x="${tx + 6}" y="${ty + 4}" class="zd-text">in</text>`;
  }
  html += px.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" class="zd-point"/>`).join("");
  svg.innerHTML = html;
  const enough = kind === "area" ? zoneDraw.points.length >= 3 : zoneDraw.points.length === 2;
  $("zone-save").disabled = !enough || !$("zone-name").value.trim();
  $("zone-hint").textContent = ZONE_HINT[kind];
  $("zone-role-label").hidden = $("zone-max-label").hidden = kind !== "area";
}

$("zone-draw").addEventListener("click", (e) => {
  const r = $("zone-draw").getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  if ($("zone-kind").value === "line" && zoneDraw.points.length >= 2) zoneDraw.points = [];
  zoneDraw.points.push([+x.toFixed(4), +y.toFixed(4)]);
  drawZonePreview();
});
$("zone-kind").onchange = () => { zoneDraw.points = []; drawZonePreview(); };
$("zone-name").oninput = drawZonePreview;
$("zone-undo").onclick = () => { zoneDraw.points.pop(); drawZonePreview(); };
document.addEventListener("keydown", (e) => {
  if (zoneDraw.on && e.key === "Escape") { zoneDraw.points = []; drawZonePreview(); }
});
new ResizeObserver(() => { if (zoneDraw.on) drawZonePreview(); }).observe($("live"));

// Area roles (Phase 44): what the place is, for the safety checks; offered from /api/zones/roles.
let zoneRoles = null;
async function loadZoneRoles() {
  if (zoneRoles) return;
  zoneRoles = await (await fetch("/api/zones/roles")).json();
  for (const r of zoneRoles) $("zone-role").add(new Option(r.words, r.role));
}
function roleOptions(current) {
  const roles = zoneRoles.some(r => r.role === current) || !current ? zoneRoles
    : [...zoneRoles, { role: current, words: current }];   // a role set before the list was narrowed
  return '<option value="">no role</option>' + roles.map(r =>
    `<option value="${esc(r.role)}"${r.role === current ? " selected" : ""}>${esc(r.words)}</option>`).join("");
}

async function loadZoneList() {
  await loadZoneRoles();
  const zones = await (await fetch("/api/zones?camera=" + encodeURIComponent(zoneCamera()))).json();
  $("zone-list").innerHTML = zones.length
    ? zones.map(z => `<div class="zone-item"><span><b>${esc(z.name)}</b> <span class="muted">${z.kind === "line"
        ? "counting line" : "area"}</span>${z.kind === "area" ? ` <select class="zone-role-edit" data-zone="${z.id}"
        title="What the place is (safety checks)">${roleOptions(z.role)}</select> <label class="muted">at most
        <input type="number" class="zone-max-edit" data-zone="${z.id}" min="1" max="10000" step="1" style="width:4.5em"
        value="${z.max_people ?? ""}" placeholder="any" title="Too crowded above this many people (empty: no limit)">
        people${z.people_now != null ? ` · now ${z.people_now}` : ""}</label>` : ""}</span><button class="danger-quiet"
        data-id="${z.id}" data-name="${esc(z.name)}">Delete</button></div>`).join("")
    : '<div class="muted">No zones on this camera yet.</div>';
}

$("zone-list").onclick = async (e) => {
  const b = e.target.closest("button[data-id]");
  if (!b || !confirm(`Delete "${b.dataset.name}"? Counts already made stay in Reports.`)) return;
  await fetch(`/api/zones/${b.dataset.id}`, { method: "DELETE" });
  loadZoneList();
};

$("zone-list").onchange = async (e) => {
  const role = e.target.matches(".zone-role-edit"), max = e.target.matches(".zone-max-edit");
  if (!role && !max) return;
  const body = role ? { role: e.target.value } : { max_people: +e.target.value || 0 };
  const r = await fetch(`/api/zones/${e.target.dataset.zone}`, { method: "PATCH",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  $("zone-msg").textContent = !r.ok ? data.detail || "Could not change it."
    : role ? `"${data.name}": ${data.role ? e.target.selectedOptions[0].text : "no role"}.`
    : `"${data.name}": ${data.max_people ? `at most ${data.max_people} people` : "no people limit"}.`;
  if (!r.ok) loadZoneList();
};

$("zone-save").onclick = async () => {
  const r = await fetch("/api/zones", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ camera: zoneCamera(), name: $("zone-name").value.trim(),
                           kind: $("zone-kind").value, points: zoneDraw.points,
                           role: $("zone-kind").value === "area" ? $("zone-role").value : "",
                           max_people: $("zone-kind").value === "area" ? (+$("zone-max").value || null) : null }) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { $("zone-msg").textContent = data.detail || "Could not save."; return; }
  $("zone-msg").textContent = `Saved "${data.name}".`;
  zoneDraw.points = [];
  $("zone-name").value = "";
  $("zone-role").value = "";
  $("zone-max").value = "";
  drawZonePreview();
  loadZoneList();
};

$("zones-btn").onclick = () => {
  zoneDraw.on = !zoneDraw.on;
  zoneDraw.points = [];
  $("zones-btn").classList.toggle("primary", zoneDraw.on);
  $("zone-draw").hidden = $("zone-bar").hidden = !zoneDraw.on;
  $("zone-msg").textContent = "";
  if (zoneDraw.on) { drawZonePreview(); loadZoneList(); }
};

// "In view now": one card per person on screen, updated several times a second.
// Cards are kept and updated in place so thumbnails don't flicker.
const STATUS_TEXT = { observing: "observing…", labeling: "analyzing…", updating: "re-analyzing…",
                      labeled: "analyzed", "colors only": "colors only" };
const cards = new Map();
let thumbTick = 0;

function mmss(s) { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function liveCard(p) {
  let el = cards.get(p.tracker_id);
  if (!el) {
    el = document.createElement("div");
    el.className = "now-card";
    el.innerHTML = '<img alt=""><div><div class="meta"></div><div class="chips"></div></div>';
    cards.set(p.tracker_id, el);
  }
  const name = p.id ? `#${p.id}` : "new person";
  const ago = p.labeled_ago_s == null ? "" : ` · updated ${mmss(p.labeled_ago_s)} ago`;
  el.querySelector(".meta").innerHTML =
    `<b>${name}</b> · in view ${mmss(p.in_view_s)} · <span class="st-${p.status.replace(" ", "-")}">`
    + `${STATUS_TEXT[p.status] || p.status}</span>${ago}`;
  const chips = phrases(p.attributes).map(c =>
    `<span class="chip" title="${esc(c.title)}">${esc(c.text)}</span>`).join("");
  const chipBox = el.querySelector(".chips");
  if (chipBox.dataset.html !== chips) { chipBox.innerHTML = chips; chipBox.dataset.html = chips; }
  if (thumbTick % 3 === 0) {
    const img = el.querySelector("img");
    const next = new Image();
    next.onload = () => { img.src = next.src; };
    next.src = `/api/live/thumb/${p.tracker_id}?${camParam()}t=${Date.now()}`;
  }
  return el;
}

async function pollLive() {
  try {
    const data = await (await fetch("/api/live?" + camParam())).json();
    thumbTick++;
    const ids = new Set(data.people.map(p => p.tracker_id));
    for (const id of [...cards.keys()]) if (!ids.has(id)) { cards.get(id).remove(); cards.delete(id); }
    const box = $("now");
    if (!data.people.length) {
      box.innerHTML = '<div class="empty">Nobody in view.</div>';
    } else {
      box.querySelector(".empty")?.remove();
      for (const p of data.people) box.appendChild(liveCard(p));
    }
    $("live-caption").textContent = `${data.fps} fps · ${data.people.length} in view`;
    $("live-dot").classList.toggle("on", data.fps > 0);
  } catch {
    $("live-dot").classList.remove("on");
  }
}

// Cameras: tabs appear when there is more than one; the video and "In view now" follow the selected one.
let camera = null;
let cameraNames = [];   // every camera with people (live ones and imported videos)
let liveNames = [];     // cameras with a live video
function camParam() { return camera ? `camera=${encodeURIComponent(camera)}&` : ""; }

function selectCamera(name) {
  camera = name;
  $("live").src = "/stream?" + camParam();
  document.querySelectorAll("#cam-tabs button").forEach(b => b.classList.toggle("active", b.dataset.cam === name));
  for (const el of cards.values()) el.remove();
  cards.clear();
  pollLive();
  if (zoneDraw.on) { zoneDraw.points = []; drawZonePreview(); loadZoneList(); }
}

async function loadCameras() {
  const cams = await (await fetch("/api/cameras")).json();
  cameraNames = cams.map(c => c.name);
  liveNames = cams.filter(c => c.live !== false).map(c => c.name);
  if (liveNames.length > 1) {
    $("cam-tabs").hidden = false;
    $("cam-tabs").innerHTML = liveNames.map(n => `<button data-cam="${esc(n)}">${esc(n)}</button>`).join("");
    $("cam-tabs").onclick = (e) => { if (e.target.dataset.cam) selectCamera(e.target.dataset.cam); };
    selectCamera(liveNames[0]);
  }
  // The people list can show one camera's people, e.g. an import (to check it, or to delete it).
  $("f-camera").hidden = cameraNames.length < 2;
  for (const c of cams) $("f-camera").add(new Option(c.live === false ? `${c.name} (${c.source})` : c.name, c.name));
  const wanted = new URLSearchParams(location.search).get("camera");
  if (wanted && cameraNames.includes(wanted)) $("f-camera").value = wanted;
}

// --- Vehicles (security cameras; labeler/vehicles.py) ---------------------------------------------------------
let vehicleView = { kind: "recent" }, vehicleHtml = "", anyVehicleCamera = false;
const vSelected = new Set();
const KIND_LABEL = { lorry: "lorry/pickup" };
for (const c of ["white", "black", "silver", "gray", "red", "blue", "green", "yellow", "orange", "brown", "beige", "purple", "pink"])
  $("v-color").add(new Option(c, c));

function vehicleCard(v) {
  const when = new Date(v.started_at).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
  const state = v.parked ? (v.left_at ? "parked, then left" : (v.ended_at ? "parked" : "parked here now"))
                         : (v.ended_at ? "passed" : "in view");
  const name = [v.make, v.model].filter(Boolean).join(" ");
  const kindColor = [v.color, KIND_LABEL[v.kind] || v.kind].filter(Boolean).join(" ");
  const chips = (kindColor ? `<span class="chip">${esc(kindColor)}</span>` : "")
    + (name ? `<span class="chip" title="Make and model are the vision model's guess">${esc(name)} <small>(guess)</small></span>` : "");
  return `<div class="person">
    <input type="checkbox" class="admin-only" data-vselect="${v.id}" ${vSelected.has(v.id) ? "checked" : ""} aria-label="Select vehicle ${v.id}">
    ${v.crop ? `<img src="/crops/${encodeURIComponent(v.crop)}?v=${encodeURIComponent(v.ended_at || "")}" alt="">` : "<img alt=\"\">"}
    <div><div class="meta">#${v.id}${cameraNames.length > 1 ? ` · ${esc(v.camera)}` : ""} · ${when} · ${state}</div>
    <div class="chips">${chips || '<span class="chip">describing…</span>'}</div>
    <a class="link" href="/recordings?camera=${encodeURIComponent(v.camera)}&amp;at=${encodeURIComponent(v.started_at)}">▶ Recording</a></div></div>`;
}

function drawVehicles(items) {
  const list = vehicleView.kind === "ask" ? vehicleView.items : items || [];
  $("v-banner").hidden = vehicleView.kind !== "ask";
  if (vehicleView.kind === "ask") $("v-banner").innerHTML = esc(vehicleView.explanation)
    + ' <button class="link" id="v-back">Show all</button>';
  const html = list.length ? list.map(vehicleCard).join("") : '<div class="empty">No matching vehicles.</div>';
  if (html !== vehicleHtml) { $("vehicles").innerHTML = html; vehicleHtml = html; }
  $("v-del").disabled = !vSelected.size;
}

async function loadVehicles() {
  if (vehicleView.kind === "ask") return;
  const q = { limit: 40 };
  if ($("v-kind").value) q.kind = $("v-kind").value;
  if ($("v-color").value) q.color = $("v-color").value;
  if ($("v-day").value) q.day = $("v-day").value;
  if ($("f-camera").value) q.camera = $("f-camera").value;
  try {
    const r = await fetch("/api/vehicles?" + new URLSearchParams(q));
    if (!r.ok) return;
    const items = await r.json();
    $("vehicles-panel").hidden = !anyVehicleCamera && !items.length && !Object.keys(q).some(k => k !== "limit");
    drawVehicles(items);
  } catch {}
}

for (const id of ["v-kind", "v-color", "v-day"]) $(id).addEventListener("change", () => { vehicleView = { kind: "recent" }; loadVehicles(); });
$("v-clear").onclick = () => { $("v-kind").value = $("v-color").value = $("v-day").value = ""; vehicleView = { kind: "recent" }; loadVehicles(); };
$("vehicles-panel").addEventListener("click", (e) => {
  if (e.target.id === "v-back") { vehicleView = { kind: "recent" }; loadVehicles(); }
});
$("vehicles").addEventListener("change", (e) => {
  const id = Number(e.target.dataset.vselect);
  if (!id) return;
  e.target.checked ? vSelected.add(id) : vSelected.delete(id);
  $("v-del").disabled = !vSelected.size;
});
$("v-del").onclick = async () => {
  if (!vSelected.size || !confirm(`Delete ${vSelected.size} vehicle(s) with their pictures?`)) return;
  await fetch("/api/vehicles/delete", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ ids: [...vSelected] }) });
  vSelected.clear();
  if (vehicleView.kind === "ask") vehicleView = { kind: "recent" };
  loadVehicles();
};
fetch("/api/cameras").then(r => r.json()).then(cams => { anyVehicleCamera = cams.some(c => c.vehicles); loadVehicles(); });
setInterval(loadVehicles, 5000);

// What's new (labeler/whatsnew.py): after an update, one line under the header naming what it added. ✕ hides it in
// this browser until the next update; opening the What's new page does too.
async function whatsNew() {
  let d;
  try { d = await (await fetch("/api/whats-new")).json(); } catch { return; }
  if (!d.new) return;
  try { if (localStorage.getItem("whatsNewSeen") === d.newest) return; } catch {}
  const titles = d.items.filter(i => i.new).map(i => esc(i.title));
  const named = titles.length > 3 ? `${titles.slice(0, 3).join(", ")} and ${titles.length - 3} more`
    : titles.join(", ");
  const box = document.createElement("div");
  box.id = "whats-new";
  box.className = "welcome";
  box.setAttribute("role", "status");
  box.innerHTML = `<span>New in this version: ${named}.</span><a href="/whats-new">See what's new</a>
    <a href="/first-run" class="admin-only">Run the first-run check</a>
    <button aria-label="Close">✕</button>`;
  box.querySelector("button").addEventListener("click", () => {
    try { localStorage.setItem("whatsNewSeen", d.newest); } catch {}
    box.remove();
  });
  document.querySelector("header").after(box);
}
whatsNew();
</script>
