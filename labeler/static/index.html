<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionLabeler</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>VisionLabeler</h1>
  <nav><a href="/" class="active">Live</a><a href="/review">Review queue</a><a href="/reports">Reports</a><a href="/alerts">Alerts</a></nav>
  <div class="status" id="status">connecting…</div>
  <button id="stop" title="Finish labeling the people in view, save, and close the app">Stop</button>
</header>
<main class="layout">
  <section class="panel">
    <div class="panel-head">
      <h2><span class="live-dot" id="live-dot"></span>Live camera</h2>
      <div class="cam-tabs" id="cam-tabs" hidden></div>
      <span class="muted" id="live-caption"></span>
      <button id="fullscreen" title="Show the live view full screen">Full screen</button>
    </div>
    <div class="video" id="video">
      <img id="live" src="/stream" alt="Live camera feed with labels">
    </div>
  </section>
  <div class="side">
  <section class="panel">
    <h2>In view now</h2>
    <div class="now" id="now"><div class="empty">Nobody in view.</div></div>
  </section>
  <section class="panel">
    <h2>People seen</h2>
    <form class="search" id="q-form">
      <input id="q" placeholder="Ask, e.g. who wore a red top after 3pm?  or describe: man in a beige coat"
             style="flex:1; min-width:180px">
      <button class="primary">Ask</button>
    </form>
    <div class="search">
      <select id="f-name"><option value="">Filter by attribute…</option></select>
      <select id="f-value" disabled><option value="">value</option></select>
      <button id="f-clear">Clear</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="select-bar">
      <label><input type="checkbox" id="sel-all"> Select all shown</label>
      <button id="del-selected" class="danger" disabled>Delete selected</button>
      <button id="del-all" class="danger-quiet" title="Delete every recorded person">Delete all…</button>
    </div>
    <div class="people" id="people"><div class="empty">No one yet.</div></div>
  </section>
  </div>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
let schema = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadSchema() {
  schema = await (await fetch("/api/schema")).json();
  for (const name of Object.keys(schema.fields)) {
    $("f-name").add(new Option(name.replace(/_/g, " "), name));
  }
}

$("f-name").onchange = () => {
  const sel = $("f-value"); sel.innerHTML = "";
  const name = $("f-name").value;
  sel.disabled = !name;
  sel.add(new Option("value", ""));
  if (name) for (const v of schema.fields[name]) sel.add(new Option(v, v));
  refresh();
};
$("f-value").onchange = () => { view = { kind: "recent" }; refresh(); };
$("f-clear").onclick = () => { $("f-name").value = ""; $("q").value = ""; view = { kind: "recent" }; $("f-name").onchange(); };

// What the list shows: recent people (auto-refreshing), a text search, or look-alikes of one person.
let view = { kind: "recent" };
$("q-form").onsubmit = (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  view = q ? { kind: "ask", q } : { kind: "recent" };
  refresh();
};
$("people").addEventListener("click", (e) => {
  const id = e.target.dataset.similar;
  if (id) { view = { kind: "similar", id: Number(id) }; refresh(); }
});
$("banner").addEventListener("click", (e) => {
  if (e.target.dataset.back !== undefined) { view = { kind: "recent" }; $("q").value = ""; refresh(); }
});

// Turn attributes into readable phrases: "age 25-34", "red t-shirt", "carrying backpack".
function phrases(a) {
  const known = (n) => a[n] && !["unknown", "none", "no"].includes(a[n].value) ? a[n].value : null;
  const out = [];
  const add = (text, names) => {
    const items = names.filter(n => a[n]).map(n => a[n]);
    out.push({
      text,
      review: items.some(x => x.needs_review),
      human: items.length > 0 && items.every(x => x.source === "human"),
      title: names.filter(n => a[n]).map(n =>
        `${n}: ${a[n].value} (${a[n].source}, ${Math.round(a[n].confidence * 100)}%)`).join("\n"),
    });
  };
  if (known("age_range")) add(`age ${known("age_range")}`, ["age_range"]);
  if (known("age_group")) add(known("age_group"), ["age_group"]);
  if (known("apparent_gender")) add(known("apparent_gender"), ["apparent_gender"]);
  for (const part of ["upper", "lower"]) {
    const color = known(part + "_color"), type = known(part + "_type");
    if (color || type) add([color, type || (part === "upper" ? "top" : "bottoms")].filter(Boolean).join(" "),
                           [part + "_color", part + "_type"]);
  }
  if (known("headwear")) add(known("headwear"), ["headwear"]);
  if (known("eyewear")) add(known("eyewear"), ["eyewear"]);
  if (a.face_mask && a.face_mask.value === "yes") add("face mask", ["face_mask"]);
  if (known("carrying")) add("carrying " + known("carrying").replace(/,/g, ", "), ["carrying"]);
  return out;
}

async function fetchTracks() {
  if (view.kind === "ask") {
    $("banner").hidden = false;
    $("banner").innerHTML = "Thinking…";
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ question: view.q, limit: 30 }) });
    if (r.ok) {
      const res = await r.json();
      view.explanation = `${res.explanation} · ${res.total} found`;
      return res.people;
    }
    view = { kind: "search", q: view.q };   // no model: fall back to appearance search
  }
  if (view.kind === "search") {
    const r = await fetch("/api/search?" + new URLSearchParams({ q: view.q, limit: 20 }));
    return r.ok ? r.json() : [];
  }
  if (view.kind === "similar") {
    const r = await fetch(`/api/tracks/${view.id}/similar?limit=10`);
    return r.ok ? r.json() : [];
  }
  const p = new URLSearchParams({ limit: 30 });
  if ($("f-name").value && $("f-value").value) { p.set("name", $("f-name").value); p.set("value", $("f-value").value); }
  return (await fetch("/api/tracks?" + p)).json();
}

// Selection for deleting: kept across refreshes, so ticks survive the 3-second auto-refresh.
const selected = new Set();
let shownIds = [];

function updateSelectBar() {
  for (const id of [...selected]) if (!shownIds.includes(id)) selected.delete(id);
  $("del-selected").disabled = selected.size === 0;
  $("del-selected").textContent = selected.size ? `Delete selected (${selected.size})` : "Delete selected";
  $("sel-all").checked = shownIds.length > 0 && shownIds.every(id => selected.has(id));
  $("sel-all").indeterminate = selected.size > 0 && !$("sel-all").checked;
}

$("people").addEventListener("change", (e) => {
  if (!e.target.matches("input[data-select]")) return;
  const id = Number(e.target.dataset.select);
  e.target.checked ? selected.add(id) : selected.delete(id);
  e.target.closest(".person").classList.toggle("is-selected", e.target.checked);
  updateSelectBar();
});
$("sel-all").onchange = () => {
  if ($("sel-all").checked) shownIds.forEach(id => selected.add(id)); else selected.clear();
  document.querySelectorAll("input[data-select]").forEach(cb => {
    cb.checked = selected.has(Number(cb.dataset.select));
    cb.closest(".person").classList.toggle("is-selected", cb.checked);
  });
  updateSelectBar();
};

async function deletePeople(body, what) {
  const r = await fetch("/api/tracks/delete", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { alert("Delete failed"); return; }
  const res = await r.json();
  selected.clear();
  await refresh();
  status();
  $("banner").hidden = false;
  $("banner").innerHTML = `Deleted ${res.deleted} ${res.deleted === 1 ? "person" : "people"} (${what}), `
    + `with ${res.pictures_removed} picture file${res.pictures_removed === 1 ? "" : "s"}. `
    + '<a href="#" data-back>OK</a>';
}

$("del-selected").onclick = () => {
  const ids = [...selected];
  if (!ids.length) return;
  if (!confirm(`Permanently delete ${ids.length} ${ids.length === 1 ? "person" : "people"}, `
               + "with their pictures, labels and review history? This cannot be undone.")) return;
  deletePeople({ ids }, "selected");
};
$("del-all").onclick = () => {
  const answer = prompt("This permanently deletes EVERY recorded person, with all pictures, labels and "
                        + "review history.\n\nType DELETE ALL to confirm:");
  if (answer !== "DELETE ALL") return;
  deletePeople({ everything: true }, "everything");
};

async function refresh() {
  const tracks = await fetchTracks();
  shownIds = tracks.map(t => t.id);
  const back = ' <a href="#" data-back>Back to recent</a>';
  $("banner").hidden = view.kind === "recent";
  if (view.kind === "search") $("banner").innerHTML = `Best matches for “${esc(view.q)}”, closest first.` + back;
  if (view.kind === "ask") $("banner").innerHTML = esc(view.explanation) + back;
  if (view.kind === "similar") $("banner").innerHTML = `People who look most like #${view.id}.` + back;
  $("people").innerHTML = tracks.length ? tracks.map(t => {
    const chips = phrases(t.attributes)
      .map(p => `<span class="chip ${p.review ? "review" : ""} ${p.human ? "human" : ""}"
         title="${esc(p.title)}">${esc(p.text)}</span>`).join("");
    const when = t.started_at.replace("T", " ");
    return `<div class="person${selected.has(t.id) ? " is-selected" : ""}">
      <input type="checkbox" data-select="${t.id}" ${selected.has(t.id) ? "checked" : ""}
             aria-label="Select person ${t.id}">
      ${t.crop ? `<img src="/crops/${encodeURIComponent(t.crop)}?v=${t.n_frames}" alt="">` : `<img alt="">`}
      <div><div class="meta">#${t.id}${cameraNames.length > 1 && t.camera ? ` · ${esc(t.camera)}` : ""} · ${when} · ${t.status}${t.low_light ? " · low light" : ""}${score(t)}</div>
      <div class="chips">${chips || '<span class="chip">labeling…</span>'}</div>
      <button class="link" data-similar="${t.id}">Look-alikes</button></div></div>`;
  }).join("") : '<div class="empty">No matching people.</div>';
  updateSelectBar();
}

function score(t) {
  if (t.similarity === undefined) return "";
  const differ = t.labels_differ ? ' · <span style="color:var(--warn)">looks similar, labels differ</span>' : "";
  return ` · <b>similarity ${t.similarity.toFixed(2)}</b>${differ}`;
}

async function status() {
  try {
    const s = await (await fetch("/api/status?" + camParam())).json();
    let warn = s.blank_picture ? '<b style="color:var(--warn)">no picture from camera</b> · ' : "";
    if (s.disk_low) warn = `<b style="color:var(--warn)">disk almost full (${s.disk_free_gb} GB free)</b> · ` + warn;
    const down = (s.cameras || []).filter(c => !c.running).map(c => c.camera);
    if (down.length) warn = `<b style="color:var(--warn)">camera not running: ${down.map(esc).join(", ")}</b> · ` + warn;
    $("status").innerHTML = warn + `mode <b>${s.mode}</b> · <b>${s.fps ?? "-"}</b> fps · <b>${s.active_people ?? 0}</b> in view · `
      + `VLM queue <b>${s.vlm_enabled ? s.vlm_queue : "off"}</b> · <b>${s.tracks}</b> people · `
      + `<a href="/review"><b>${s.needs_review}</b> to review</a>`;
  } catch { $("status").textContent = "disconnected"; }
}

$("stop").onclick = async () => {
  if (!confirm("Stop VisionLabeler? People in view are saved and labeling finishes first.")) return;
  $("stop").disabled = true;
  try { await fetch("/api/shutdown", { method: "POST" }); } catch {}
  document.querySelector("main").innerHTML =
    '<div class="panel">Stopping… You can close this tab. The console window shows when it has finished.</div>';
};

$("fullscreen").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $("video").requestFullscreen().catch(() => {});
};

// "In view now": one card per person on screen, updated several times a second.
// Cards are kept and updated in place so thumbnails don't flicker.
const STATUS_TEXT = { observing: "observing…", labeling: "analyzing…", updating: "re-analyzing…",
                      labeled: "analyzed", "colors only": "colors only" };
const cards = new Map();
let thumbTick = 0;

function mmss(s) { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function liveCard(p) {
  let el = cards.get(p.tracker_id);
  if (!el) {
    el = document.createElement("div");
    el.className = "now-card";
    el.innerHTML = '<img alt=""><div><div class="meta"></div><div class="chips"></div></div>';
    cards.set(p.tracker_id, el);
  }
  const name = p.id ? `#${p.id}` : "new person";
  const ago = p.labeled_ago_s == null ? "" : ` · updated ${mmss(p.labeled_ago_s)} ago`;
  el.querySelector(".meta").innerHTML =
    `<b>${name}</b> · in view ${mmss(p.in_view_s)} · <span class="st-${p.status.replace(" ", "-")}">`
    + `${STATUS_TEXT[p.status] || p.status}</span>${ago}`;
  const chips = phrases(p.attributes).map(c =>
    `<span class="chip" title="${esc(c.title)}">${esc(c.text)}</span>`).join("");
  const chipBox = el.querySelector(".chips");
  if (chipBox.dataset.html !== chips) { chipBox.innerHTML = chips; chipBox.dataset.html = chips; }
  if (thumbTick % 3 === 0) {
    const img = el.querySelector("img");
    const next = new Image();
    next.onload = () => { img.src = next.src; };
    next.src = `/api/live/thumb/${p.tracker_id}?${camParam()}t=${Date.now()}`;
  }
  return el;
}

async function pollLive() {
  try {
    const data = await (await fetch("/api/live?" + camParam())).json();
    thumbTick++;
    const ids = new Set(data.people.map(p => p.tracker_id));
    for (const id of [...cards.keys()]) if (!ids.has(id)) { cards.get(id).remove(); cards.delete(id); }
    const box = $("now");
    if (!data.people.length) {
      box.innerHTML = '<div class="empty">Nobody in view.</div>';
    } else {
      box.querySelector(".empty")?.remove();
      for (const p of data.people) box.appendChild(liveCard(p));
    }
    $("live-caption").textContent = `${data.fps} fps · ${data.people.length} in view`;
    $("live-dot").classList.toggle("on", data.fps > 0);
  } catch {
    $("live-dot").classList.remove("on");
  }
}

// Cameras: tabs appear when there is more than one; the video and "In view now" follow the selected one.
let camera = null;
let cameraNames = [];
function camParam() { return camera ? `camera=${encodeURIComponent(camera)}&` : ""; }

function selectCamera(name) {
  camera = name;
  $("live").src = "/stream?" + camParam();
  document.querySelectorAll("#cam-tabs button").forEach(b => b.classList.toggle("active", b.dataset.cam === name));
  for (const el of cards.values()) el.remove();
  cards.clear();
  pollLive();
}

async function loadCameras() {
  cameraNames = (await (await fetch("/api/cameras")).json()).map(c => c.name);
  if (cameraNames.length > 1) {
    $("cam-tabs").hidden = false;
    $("cam-tabs").innerHTML = cameraNames.map(n => `<button data-cam="${esc(n)}">${esc(n)}</button>`).join("");
    $("cam-tabs").onclick = (e) => { if (e.target.dataset.cam) selectCamera(e.target.dataset.cam); };
    selectCamera(cameraNames[0]);
  }
}

// Alert pop-ups: new alerts since the page opened appear bottom-right for 20 seconds.
let lastAlert = null;
async function pollAlerts() {
  try {
    const data = await (await fetch("/api/alerts/events?since_id=" + (lastAlert ?? 0) + "&limit=10")).json();
    if (lastAlert === null) { lastAlert = data.latest_id; return; }   // don't replay old alerts
    for (const e of data.events.reverse()) {
      lastAlert = Math.max(lastAlert, e.id);
      const t = document.createElement("div");
      t.className = "toast";
      t.innerHTML = `${e.crop ? `<img src="/crops/${encodeURIComponent(e.crop)}" alt="">` : ""}
        <div><b>Alert</b> · ${esc(e.camera)}<br>${esc(e.message)}<br><small>person #${e.track_id}</small></div>`;
      t.onclick = () => t.remove();
      $("toasts").prepend(t);
      setTimeout(() => t.remove(), 20000);
    }
  } catch {}
}
pollAlerts();
setInterval(pollAlerts, 3000);

loadCameras().then(refresh);
loadSchema().then(refresh);
status();
pollLive();
setInterval(pollLive, 400);
setInterval(() => { if (view.kind === "recent") refresh(); }, 3000);
setInterval(status, 1000);
</script>
</body>
</html>
