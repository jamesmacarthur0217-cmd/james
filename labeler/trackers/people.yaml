# ByteTrack tuned for people close to a camera (kiosk) and for security views.
# The detector passes everything above detector.conf (0.1) to the tracker:
#   - confident detections (>= track_high_thresh) are matched first;
#   - weak ones (track_low_thresh .. track_high_thresh) only keep an existing person alive
#     through blurry or half-visible frames, and never start a new person.
tracker_type: bytetrack
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5   # a new person needs a clear detection
track_buffer: 90        # remember a lost person for ~3 s at 30 fps (default 30 = 1 s)
match_thresh: 0.8
fuse_score: True
