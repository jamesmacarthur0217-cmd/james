# PostgreSQL with the pgvector extension, reachable only from this PC.
# The password comes from .env (created by setup, never committed).
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: visionlabeler-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: visionlabeler
      POSTGRES_DB: visionlabeler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionlabeler -d visionlabeler"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
