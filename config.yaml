# VisionLabeler configuration.
# Paths are relative to this folder unless absolute.
# Changes made on the Settings page (cameras, retention, blurring, HTTPS, retraining) are saved in
# data/settings.yaml and win over the values here; delete that file to use only this one.

# One entry per camera. Each runs on its own; the vision model and database are shared.
cameras:
  - name: cam1                # unique name, shown in the web page
    # Webcam index (0, 1, ...), a video file path, an image path, or an rtsp:// URL.
    source: 0                 # your USB webcam; use samples/bus.jpg for the demo image
    loop_files: true          # restart video/image files when they end
    # Areas of the picture to ignore, e.g. a monitor, TV or poster showing people.
    # Each zone is [left, top, right, bottom] as fractions of the frame (0 to 1):
    #   ignore_zones: [[0.28, 0.40, 0.45, 0.65]]
    ignore_zones: []
    # mode: kiosk             # optional: overrides the global mode below for this camera
    # retention_days: 7       # optional: keep this camera's people this many days (else storage.retention_days)
    # imgsz: 1280             # optional: detector picture size for this camera (else detector.imgsz)
  # A second camera, e.g. an IP camera at the entrance:
  # - name: entrance
  #   source: rtsp://user:password@192.168.1.50:554/stream1
  #   mode: security
  #   imgsz: 1280             # a wide Full-HD camera with far-away people (see README, Detection)

# kiosk    = people close to the camera, facing it: age range, eyewear, face mask
# security = people far away: clothing, bags, age group only
mode: kiosk

detector:
  model: yolo11s-pose.pt  # downloaded automatically on first run
  conf: 0.1               # low on purpose: weak detections only keep known people tracked
  imgsz: 640              # the picture is shrunk to this size for detection; a camera can set its own
  device: 0               # GPU index, or "cpu"
  tracker: labeler/trackers/people.yaml   # ByteTrack tuned for people; see that file
  min_box_area:           # new people smaller than this share of the frame are ignored
    kiosk: 0.03           # a kiosk user is close; this skips people far behind and pictures of people
    security: 0.0         # in security views people are far away and small

tracking:
  min_frames_keep: 8          # tracks shorter than this are treated as noise
  min_frames_for_label: 20    # frames seen before the VLM is asked to label a person
  best_frames: 5              # best-quality frames kept per track
  lost_after_s: 4.0           # a track is finished after this long unseen (longer than the tracker's memory)
  color_every_n_frames: 2
  relink:                     # a person who leaves and returns continues the same record
    enabled: true
    window_s: 30              # how long after leaving a person can still be re-linked
    check_at_frames: [5, 12]  # when a new track is compared with recently lost people
    short_gap_s: 5            # gaps up to this long: moderate similarity + similar position
    short_gap_min_similarity: 0.75
    short_gap_min_overlap: 0.2
    long_gap_min_similarity:  # longer gaps: appearance alone, so the bar is high
      kiosk: 0.90             # people close to the camera (measured on webcam footage)
      security: 0.98          # far or from above, people look alike: at 0.90, 20 of 24 joins were wrong (README)

# Areas and counting lines are drawn on the Live page (admin) and stored in the database.
zones:
  min_frames: 3               # a person must be in/out (or across a line) this many frames in a row to count

# "Timeline" on the Live page: where a person was seen, from look-alikes on all cameras in time order.
timeline:
  min_similarity: 0.8         # how alike (0..1, mostly clothing); not measured across different cameras yet
  window_h: 24                # only sightings within this many hours of the person

# A short video around each alert (Alerts page, admins). Deleted with the person (retention, Delete).
clips:
  enabled: true
  before_s: 5                 # seconds before the alert (kept in memory, about 5 MB per camera)
  after_s: 5                  # seconds after
  fps: 10
  max_width: 960              # pixels; a 10 s clip is about 1-2 MB

# A short video of each person (admins: the video button on a person). Deleted with the person.
person_videos:
  enabled: true
  max_s: 20                   # at most this long: from 1 s before they appear (their arrival shows the most)
  fps: 5
  max_width: 480              # pixels; about 1-2 MB per person (README)
  before_s: 1
  after_s: 1

# Camera problems (shown on the Live page and the Alerts page). A problem must last this long to count.
health:
  enabled: true
  offline_after_s: 10         # no picture at all
  blank_after_s: 10           # a blank picture (lens covered, or another app is using the camera)
  slow_after_s: 30            # below min_fps
  min_fps: 5
  startup_grace_s: 30         # ignore the first seconds after start (webcams warm up)

# Time in view and time facing the camera (Reports). A frame counts as facing when the nose is near the middle
# between the eyes and the face looks straight enough (0..1). Set from 6 people in two demo photos; check it
# on your own camera.
engagement:
  facing_min: 0.6
  looked_s: 3                 # "looked at the camera" = facing it at least this many seconds in total

vlm:
  enabled: true
  host: http://127.0.0.1:11434    # not "localhost": on this PC that adds ~2 s to every request
  model: qwen3-vl:4b-instruct
  workers: 1                  # requests sent at once. Measured on this PC: 1.8 s per person with 1;
                              # 2 at once is no faster (the GPU is the limit) and makes each person wait longer
  frames_per_track: 2         # frames labeled per person; disagreement lowers confidence
  relabel_every_s: 15         # re-analyze people who stay in view (0 = label once only)
  history_frames: 4           # labels are a vote over this many recent answers per person
  timeout_s: 90
  max_queue: 32

embeddings:
  enabled: true               # appearance vectors for text search and look-alike search
  model: google/siglip2-base-patch16-224
  device: cuda

age_model:                    # apparent age from face crops; more accurate than the VLM (tools/bench_age.py)
  enabled: true
  model: dima806/fairface_age_image_detection

student:                      # fast attribute classifiers trained from VLM labels (tools/train_attributes.py)
  enabled: true
  model_path: models/attributes.joblib
  every_n_frames: 15          # instant labels for the live view, refreshed this often per person
  skip_vlm_when_confident: true   # skip the VLM when every attribute is confident (rare with current data)
  retrained_path: data/models/attributes.joblib   # written by the weekly retraining; used when present

# Weekly retraining of the fast classifiers on your own cameras (Answer key page shows each run).
# A new version is kept only if it scores at least as well on the answer key.
retrain:
  enabled: true
  every_days: 7
  hour: 3                     # not before this hour (night)
  own_weight: 3               # a person from your cameras counts this many times a COCO practice person
  min_own_people: 30          # finished people from your cameras (not in the answer key) needed to train
  min_answer_key: 10          # answer-key people needed to check a new version
  target: 0.9
  coco_dir: data/datasets/coco_people

review:
  confidence_threshold: 0.6   # below this, an attribute goes to the review queue
  spot_check_every: 5         # every 5th item is a confident label picked to check, for variety (0 = off)

database:
  # PostgreSQL + pgvector in Docker (start it with: docker compose up -d).
  # The address and password live in .env. For a quick test without Docker use:
  #   url: sqlite:///data/vision.db
  url: ${DATABASE_URL}

# Database backups (PostgreSQL) into data/backups: daily while the app runs, and when stop.bat stops it.
backup:
  enabled: true               # the daily backup while running (stop.bat backs up either way)
  hour: 2                     # not before this hour (night); a PC that is off then catches up later in the day
  keep: 7                     # newest backups kept
  copy_to: ""                 # also copy each backup to this folder, e.g. E:/VisionLabelerBackups (another disk
                              # or a USB drive: a backup on the same disk is lost with the disk)

# Everything the app window shows is also written here, so messages can be read after the window is closed.
logs:
  dir: data/logs              # visionlabeler.log (the app) and supervisor.log (restarts after crashes)
  max_mb: 10                  # a full file is renamed .1, .2, ...; the oldest beyond `keep` is deleted
  keep: 5

storage:
  crop_dir: data/crops
  save_face_crops: false      # face images are biometric data; off by default
  blur_faces: false           # true: faces are blurred in the saved pictures, so nobody (admins too) sees them
                              # later; labeling is not affected, but Review/Answer key can't show faces
  retention_days: 30          # people older than this are deleted, at startup and every hour (0 = keep forever);
                              # a camera can set its own retention_days
  audit_retention_days: 365   # audit log entries (who viewed, searched, deleted...) kept this long (0 = forever)
  min_free_gb: 5              # warn when the disk has less free space than this

web:
  host: 0.0.0.0               # other devices may connect (they must log in). 127.0.0.1 = this PC only.
                              # With no login account yet, the app stays on this PC only (see the warning)
  port: 8000
  session_hours: 12           # other devices log in again after this long; this PC never needs to log in
  blur_faces_for_viewers: true   # viewer accounts see blurred faces (live video and pictures); admins see faces
  https: true                 # true: other devices use https://<this PC>:8443 (encrypted); plain http then
                              # works only on this PC (http://127.0.0.1:8000, used by start.bat / stop.bat)
  https_port: 8443
  cert_file: data/tls/cert.pem   # made automatically (self-signed) if missing; or put your own here
  key_file: data/tls/key.pem
  # A monitoring tool may call /api/health?token=<this> without logging in (status only: 200 OK, 503 problem).
  # Empty = only logged-in users. Put a long random value in .env as VL_HEALTH_TOKEN=...
  health_token: ${VL_HEALTH_TOKEN:-}
  # Older setups: a shared password in .env (VL_WEB_PASSWORD) becomes the first admin account at startup.
  username: admin
  password: ${VL_WEB_PASSWORD:-}
